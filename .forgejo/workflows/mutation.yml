name: Mutation testing (nightly incremental, weekly full per group)

# cargo-mutants over Horcrux's core modules (VM lifecycle/snapshots, backup,
# storage). Each surviving mutant is a behaviour no test checks.
#
# Full run: each group once a week on its own weekday (full_dow in the matrix),
# scored against the floors in ci/mutants-floors.json, which only ever go up (the
# job prints when a floor can be raised). The other nights a group only mutates
# the lines changed since its last green run (cargo-mutants --in-diff, decided by
# ci/mutation-incremental.py - canonical copy in ctg-infrastructure
# ci-runners/mutation-incremental) and fails on any new surviving mutant there; a
# group whose files did not change finishes in about a minute.
# One job per group (a single job over all ~520 mutants needs ~10 h:
# every mutant used to rebuild the whole horcrux-api crate).
on:
  # Event-driven (2026-11-06): every push to main that touches mutated code runs mutation-incremental.py plan (incremental on changed
  # lines, skip when nothing mutated changed; full on a group's own weekday). Coalesced by the replace: group below. No cron.
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - 'horcrux-api/src/**'
      - 'horcrux-common/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'ci/mutation-incremental.py'
      - 'ci/mutants-floors.json'
      - '.forgejo/workflows/mutation.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: 'auto (full on the group''s weekday, else changed lines only), full or incremental'
        required: false
        default: 'auto'

# latest: group (ci-supersede-sweeper): started runs are never cancelled; of the unstarted runs
# the sweeper keeps the NEWEST and, while nothing in the group has started, also the OLDEST, which
# holds its queue position. A replace: group kept only the newest, so on a busy main (a push every
# few minutes) each push cancelled the queued run and no mutation run ever reached the lane (shard 0
# of run 5241 stayed red 28 h although its fix was on main). Branch runs still cancel older ones.
concurrency:
  group: "latest:${{ github.workflow }}@${{ github.ref }}"
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: never
  CARGO_PROFILE_DEV_DEBUG: 0
  # --jobs 2 mutants at a time x 2 rustc each = the colo slot's 4 CPUs. libtest keeps its default
  # thread count: with 2 threads the workspace suite outgrew cargo-mutants' 20 s test timeout and
  # every mutant "timed out" (= counted as caught) - mutation-incremental.py gate now fails on that.
  # --minimum-test-timeout 90: the unmutated baseline runs alone (0-2 s, so cargo-mutants auto-sets
  # 20 s), but each mutant's tests run beside the other job's rustc on a shared host and take
  # ~18 s; vm-runtime run 577 had 14 of 50 mutants "time out" at 20 s (false catches).
  CARGO_BUILD_JOBS: 2

jobs:
  mutants:
    name: cargo-mutants (${{ matrix.group }}${{ matrix.shards > 1 && format(' shard {0}', matrix.shard) || '' }})
    strategy:
      fail-fast: false
      matrix:
        # Keep in sync with the group names in ci/mutants-floors.json
        # (mutants_floor.py fails on a group with no mutants tested).
        # full_dow: ISO weekday (UTC) of the group's weekly full run, one group per day.
        include:
          # shards: a full pass of vm-runtime is 232 mutants x ~230 s / 2 jobs = ~7 h, past the runner's 3 h maximum run time (run 3967 was
          # cancelled by it at 08:24Z). A group with shards > 1 runs its FULL pass as `cargo mutants --shard i/N` in N parallel jobs
          # (each ~1/N of the time, same mutants, nothing skipped) and the `mutation-score` job merges the shards and applies the floor and the
          # baseline gate to the whole. Incremental runs (changed lines only) stay in shard 0.
          - { group: vm-snapshot, full_dow: 1, shard: 0, shards: 1 }
          - { group: vm-runtime, full_dow: 4, shard: 0, shards: 4 }
          - { group: vm-runtime, full_dow: 4, shard: 1, shards: 4 }
          - { group: vm-runtime, full_dow: 4, shard: 2, shards: 4 }
          - { group: vm-runtime, full_dow: 4, shard: 3, shards: 4 }
          - { group: backup, full_dow: 5, shard: 0, shards: 1 }
          - { group: storage, full_dow: 6, shard: 0, shards: 1 }
    # shared mutation/chaos lane (x86 slots on rw-man-01..05 since 2026-10-18,
    # ctg-infrastructure ci-runners/README.md); jobs that must stay on colo set CI_COLO_ONLY=1.
    runs-on: mutation-x86_64
    container: catthehacker/ubuntu:act-26.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          # the incremental diff starts at the group's last green run
          fetch-depth: 0

      - name: Refuse on EC2 (colo lane only)
        # Belt and braces for the runs-on label: rw-man-02..05 are EC2 under GuardDuty.
        run: sh ci/ec2-guard.sh "cargo-mutants"

      - name: Mutation baseline (last green run)
        uses: actions/cache@v4
        with:
          path: .mutation-baseline
          # saved only when the job succeeds; restore-keys picks the newest green baseline
          key: mutation-baseline-${{ matrix.group }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}
          restore-keys: mutation-baseline-${{ matrix.group }}-

      - name: Full or incremental?
        run: |
          files=$(python3 -c 'import json,sys; print(" ".join(json.load(open("ci/mutants-floors.json"))[sys.argv[1]]["files"]))' "${{ matrix.group }}")
          python3 ci/mutation-incremental.py plan --id "${{ matrix.group }}" --full-dow "${{ matrix.full_dow }}" \
            --mode "${{ github.event.inputs.mode }}" -- $files

      - name: Shards other than 0 only take part in a full pass
        if: env.MUT_MODE != 'full' && matrix.shard != 0
        run: echo "MUT_MODE=skip" >> "$GITHUB_ENV"

      - name: Ensure Node.js is present (self-heal)
        if: env.MUT_MODE != 'skip'
        run: |
          if ! command -v node >/dev/null 2>&1; then
            bash "$GITHUB_WORKSPACE/ci/apt-install.sh" nodejs
          fi

      - name: Install Rust toolchain
        if: env.MUT_MODE != 'skip'
        uses: https://github.com/dtolnay/rust-toolchain@stable

      - name: Install build tools
        if: env.MUT_MODE != 'skip'
        # qemu-img backs the snapshot/backup unit tests.
        run: |
          bash "$GITHUB_WORKSPACE/ci/apt-install.sh" build-essential libvirt-dev libpam0g-dev qemu-utils zstd python3

      - name: Cache cargo
        if: env.MUT_MODE != 'skip'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-mutants
            target
          key: ${{ runner.os }}-cargo-mutants-${{ matrix.group }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-mutants-
            ${{ runner.os }}-cargo-

      - name: Install cargo-mutants
        if: env.MUT_MODE != 'skip'
        run: |
          # crates.io fetches are the flaky part: retry the install only, never the mutation run.
          command -v cargo-mutants && exit 0
          for n in 1 2 3 4; do
            cargo install cargo-mutants --locked && exit 0
            echo "cargo install attempt $n failed, retrying in $((n * 20)) s" >&2
            sleep $((n * 20))
          done
          exit 1

      - name: Run cargo-mutants on ${{ matrix.group }}
        if: env.MUT_MODE != 'skip'
        run: |
          spec='import json,sys; g=json.load(open("ci/mutants-floors.json"))[sys.argv[1]]'
          pkg=$(python3 -c "$spec; print(g['package'])" "${{ matrix.group }}")
          files=$(python3 -c "$spec; print(' '.join('--file '+f for f in g['files']))" "${{ matrix.group }}")
          diff=""
          [ "$MUT_MODE" = incremental ] && diff="--in-diff $MUT_DIFF"
          shard=""
          [ "$MUT_MODE" = full ] && [ "${{ matrix.shards }}" -gt 1 ] && shard="--shard ${{ matrix.shard }}/${{ matrix.shards }}"
          echo "mutating ($pkg, $MUT_MODE): $files"
          # Library unit tests are the oracle (the HTTP/QEMU suites need a
          # live server). The modules live in workspace crates now (see
          # crates/), so --test-workspace runs every crate's unit tests
          # against each mutant - the same tests that used to share the
          # one horcrux-api library, and only the mutated crate and its
          # dependents are rebuilt. --no-shuffle keeps runs comparable
          # week to week.
          set +e
          cargo mutants -p "$pkg" --test-workspace=true --all-features $files $diff $shard --jobs 2 --no-shuffle \
            --cargo-arg=--lib --timeout-multiplier 3 --minimum-test-timeout 90 --output /tmp/mutants
          rc=$?
          set -e
          echo "cargo-mutants exit $rc (2 = missed mutants, 3 = timeouts: scored below)"
          if [ -f /tmp/mutants/mutants.out/outcomes.json ]; then
            case $rc in 0|2|3) ;; *) exit 1 ;; esac
          elif [ "$MUT_MODE" = incremental ] && [ $rc = 0 ]; then
            echo "no mutants in the changed lines"
          else
            exit 1
          fi

      - name: Keep this shard's outcomes for the mutation-score job
        if: env.MUT_MODE == 'full' && matrix.shards > 1
        run: mkdir -p .mutshard/${{ matrix.shard }} && cp /tmp/mutants/mutants.out/outcomes.json .mutshard/${{ matrix.shard }}/outcomes.json && { cat /tmp/mutants/mutants.out/missed.txt > .mutshard/${{ matrix.shard }}/missed.txt 2>/dev/null || true; }

      - name: Shard outcomes (saved when the job succeeds)
        if: env.MUT_MODE == 'full' && matrix.shards > 1
        uses: actions/cache/save@v4
        with:
          path: .mutshard/${{ matrix.shard }}
          key: mutshard-${{ matrix.group }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}

      - name: Enforce mutation score floor
        if: env.MUT_MODE == 'full' && matrix.shards == 1
        run: python3 ci/mutants_floor.py /tmp/mutants/mutants.out ci/mutants-floors.json "${{ matrix.group }}"

      - name: New survivors in the changed code / record the baseline
        if: env.MUT_MODE != 'skip' && (matrix.shards == 1 || env.MUT_MODE == 'incremental')
        run: python3 ci/mutation-incremental.py gate --id "${{ matrix.group }}" --kind cargo --mode "$MUT_MODE" --allow-empty -- /tmp/mutants/mutants.out

      - name: Missed mutants
        if: always()
        run: cat /tmp/mutants/mutants.out/missed.txt 2>/dev/null || true

  # Whole-group score for a sharded full pass: merge the shards' outcomes, apply the floor (never lowered) and record the baseline survivors.
  mutation-score:
    name: mutation score (${{ matrix.group }}, merged shards)
    needs: [mutants]
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { group: vm-runtime, full_dow: 4, shards: 4 }
    runs-on: mutation-x86_64
    container: catthehacker/ubuntu:act-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mutation baseline (last green run)
        uses: actions/cache@v4
        with:
          path: .mutation-baseline
          key: mutation-baseline-${{ matrix.group }}-${{ github.run_id }}-${{ github.run_attempt }}-score
          restore-keys: mutation-baseline-${{ matrix.group }}-

      # Whether this run was a full pass is decided by the shards (shard 0 saves its outcomes only in a full pass), not re-planned here: a pass that
      # starts before midnight UTC and ends after it must not turn into an "incremental" verdict and skip the floor.
      - name: Shard 0 outcomes (present only after a full pass)
        id: s0
        uses: actions/cache/restore@v4
        with:
          path: .mutshard/0
          key: mutshard-${{ matrix.group }}-${{ github.run_id }}-${{ github.run_attempt }}-0

      - name: Load the baseline state
        if: steps.s0.outputs.cache-hit == 'true'
        run: |
          files=$(python3 -c 'import json,sys; print(" ".join(json.load(open("ci/mutants-floors.json"))[sys.argv[1]]["files"]))' "${{ matrix.group }}")
          python3 ci/mutation-incremental.py plan --id "${{ matrix.group }}" --full-dow "${{ matrix.full_dow }}" --mode full -- $files

      - name: Shard 1 outcomes
        if: steps.s0.outputs.cache-hit == 'true'
        uses: actions/cache/restore@v4
        with:
          path: .mutshard/1
          key: mutshard-${{ matrix.group }}-${{ github.run_id }}-${{ github.run_attempt }}-1
          fail-on-cache-miss: true

      - name: Shard 2 outcomes
        if: steps.s0.outputs.cache-hit == 'true'
        uses: actions/cache/restore@v4
        with:
          path: .mutshard/2
          key: mutshard-${{ matrix.group }}-${{ github.run_id }}-${{ github.run_attempt }}-2
          fail-on-cache-miss: true

      - name: Shard 3 outcomes
        if: steps.s0.outputs.cache-hit == 'true'
        uses: actions/cache/restore@v4
        with:
          path: .mutshard/3
          key: mutshard-${{ matrix.group }}-${{ github.run_id }}-${{ github.run_attempt }}-3
          fail-on-cache-miss: true

      - name: Merge the shards
        if: steps.s0.outputs.cache-hit == 'true'
        run: python3 ci/mutants_merge.py .mutshard /tmp/mutants/mutants.out ${{ matrix.shards }}

      - name: Enforce mutation score floor
        if: steps.s0.outputs.cache-hit == 'true'
        run: python3 ci/mutants_floor.py /tmp/mutants/mutants.out ci/mutants-floors.json "${{ matrix.group }}"

      - name: Record the baseline
        if: steps.s0.outputs.cache-hit == 'true'
        run: python3 ci/mutation-incremental.py gate --id "${{ matrix.group }}" --kind cargo --mode full --allow-empty -- /tmp/mutants/mutants.out

      - name: Missed mutants
        if: always() && steps.s0.outputs.cache-hit == 'true'
        run: cat /tmp/mutants/mutants.out/missed.txt 2>/dev/null || true


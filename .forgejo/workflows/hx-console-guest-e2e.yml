name: Horcrux Console guest tools e2e (Windows + Linux guests, browser, KVM)

# Phase C2b of docs/design/horcrux-console.md: real Windows 11 and Debian
# guests created through the API with the QEMU guest agent; the node
# attaches the guest tools CD and installs the tools through the guest agent
# (Windows: automatically when the viewer opens; Linux: the "Install guest
# tools" API action), then headless Chromium views them through the node's
# WebRTC client with the guest-encoded stream over the real virtio-serial
# port: input, clipboard both ways, resize, audio, latency
# (horcrux-api/tests/hx_console_guest_e2e.{sh,py}).
#
# The installed Windows image is cached per runner in the Docker volume
# hxc-win-img, keyed by both ISOs and the answer file
# (ci/windows-test-image.py key), so only the first run on a runner (or a
# changed ISO/answer file) installs Windows (40-60 min).
on:
  push:
    paths:
      - 'crates/horcrux-vm/src/console/hxc/**'
      - 'crates/horcrux-guest-proto/**'
      - 'crates/horcrux-guest-tools/**'
      - 'horcrux-api/src/api/hx_console.rs'
      - 'horcrux-api/horcrux-ui/src/pages/console.rs'
      - 'horcrux-api/tests/hx_console_guest_e2e.*'
      - 'ci/windows-test-image.py'
      - 'ci/windows-test/**'
      - 'ci/linux-test-image.py'
      - 'ci/build-guest-tools-*.sh'
      - 'packaging/windows/**'
      - 'packaging/linux/**'
      - '.forgejo/workflows/hx-console-guest-e2e.yml'
  workflow_dispatch: {}

concurrency:
  group: "replace:${{ github.workflow }}@${{ github.ref }}"
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: never
  CARGO_BUILD_JOBS: "3"
  # Microsoft's Windows 11 Enterprise evaluation ISO (x64, en-US), free for
  # testing; shared with hx-console-e2e.yml through the hxc-win-iso volume
  WIN_EVAL_URL: https://go.microsoft.com/fwlink/?linkid=2289031&clcid=0x409&culture=en-us&country=us
  # virtio-win drivers + QEMU guest agent for Windows (Fedora's builds), pinned
  VIRTIO_WIN_URL: https://fedorapeople.org/groups/virt/virtio-win/direct-downloads/archive-virtio/virtio-win-0.1.302-1/virtio-win.iso
  VIRTIO_WIN_SHA256: 303f7ae40dad495d6ae474fdc571df58958a4dbc5c37a522d80f9a203867949d

jobs:
  guest-e2e:
    name: Guest tools in Windows + Debian VMs through the browser client
    runs-on: kvm-x86_64
    container: catthehacker/ubuntu:act-26.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: https://github.com/dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown,x86_64-pc-windows-gnu,x86_64-unknown-linux-musl

      - name: Install tools
        run: |
          for i in 1 2 3; do
            sudo apt-get update -qq || true
            apt-cache policy wixl | grep -q 'Candidate: [0-9]' && break
            sleep 15
          done
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            build-essential clang cmake libvirt-dev libpam0g-dev qemu-system-x86 qemu-utils \
            qemu-system-modules-opengl ffmpeg ovmf swtpm swtpm-tools xorriso \
            gcc-mingw-w64-x86-64 msitools wixl python3-venv curl
          ls -l /dev/kvm
          qemu-system-x86_64 -display help | grep -x dbus

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-hx-guest-e2e-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-hx-guest-e2e-

      - name: Build horcrux-api (all features) and the web UI
        run: |
          cargo build -p horcrux-api --all-features
          if ! command -v trunk >/dev/null; then
            curl -fsSL https://github.com/trunk-rs/trunk/releases/latest/download/trunk-x86_64-unknown-linux-gnu.tar.gz | sudo tar xz -C /usr/local/bin trunk
          fi
          (cd horcrux-api/horcrux-ui && trunk build --release)

      - name: Guest tools (MSI, Linux agent and packages, tools CD)
        run: |
          bash ci/build-guest-tools-msi.sh
          cargo build -p horcrux-guest-tools --release --target x86_64-unknown-linux-musl
          if [ -f ci/build-guest-tools-pkgs.sh ]; then bash ci/build-guest-tools-pkgs.sh; fi
          bash ci/build-guest-tools-iso.sh

      - name: Windows test image (runner cache volume hxc-win-img)
        run: |
          set -euo pipefail
          mkdir -p /tmp/hxw
          docker volume create hxc-win-iso >/dev/null
          docker volume create hxc-win-img >/dev/null
          docker run --rm -e URL="$WIN_EVAL_URL" -e VURL="$VIRTIO_WIN_URL" -e VSUM="$VIRTIO_WIN_SHA256" \
            -v hxc-win-iso:/c debian:bookworm bash -c '
            set -e
            need=0; [ -s /c/win11-eval.iso ] || need=1
            echo "$VSUM  /c/virtio-win.iso" | sha256sum -c --quiet 2>/dev/null || need=1
            [ $need = 0 ] && exit 0
            apt-get update -qq >/dev/null && apt-get install -y -qq curl ca-certificates >/dev/null
            if [ ! -s /c/win11-eval.iso ]; then
              curl -fsSL --retry 3 -o /c/win11-eval.iso.part "$URL" && mv /c/win11-eval.iso.part /c/win11-eval.iso
            fi
            if ! echo "$VSUM  /c/virtio-win.iso" | sha256sum -c --quiet 2>/dev/null; then
              curl -fsSL --retry 3 -o /c/virtio-win.iso.part "$VURL"
              echo "$VSUM  /c/virtio-win.iso.part" | sha256sum -c --quiet
              mv /c/virtio-win.iso.part /c/virtio-win.iso
            fi'
          docker run --rm -v hxc-win-iso:/c:ro debian:bookworm cat /c/win11-eval.iso > /tmp/hxw/win11-eval.iso
          docker run --rm -v hxc-win-iso:/c:ro debian:bookworm cat /c/virtio-win.iso > /tmp/hxw/virtio-win.iso
          KEY=$(python3 ci/windows-test-image.py key /tmp/hxw/win11-eval.iso /tmp/hxw/virtio-win.iso)
          echo "image key $KEY"
          if docker run --rm -v hxc-win-img:/c:ro debian:bookworm test -s "/c/win-$KEY.qcow2"; then
            docker run --rm -v hxc-win-img:/c:ro debian:bookworm cat "/c/win-$KEY.qcow2" > /tmp/hxw/win-test.qcow2
            echo "cached image win-$KEY.qcow2"
          else
            python3 -u ci/windows-test-image.py build /tmp/hxw/win11-eval.iso /tmp/hxw/virtio-win.iso /tmp/hxw/win-test.qcow2
            docker run -i --rm -v hxc-win-img:/c debian:bookworm sh -c \
              "cat > /c/win-$KEY.qcow2.part && mv /c/win-$KEY.qcow2.part /c/win-$KEY.qcow2 && find /c -name 'win-*.qcow2*' ! -name win-$KEY.qcow2 -delete" \
              < /tmp/hxw/win-test.qcow2
          fi
          rm -f /tmp/hxw/win11-eval.iso /tmp/hxw/virtio-win.iso
          ls -l /tmp/hxw

      - name: Debian test image (FFmpeg + qemu-guest-agent, no Horcrux tools)
        run: python3 -u ci/linux-test-image.py /tmp/hxw/debian-test.qcow2

      - name: Guest tools e2e (Windows + Debian through the browser client)
        run: |
          set -o pipefail
          HXG_TOOLS_ISO=dist/horcrux-guest-tools.iso HXG_WIN_IMAGE=/tmp/hxw/win-test.qcow2 \
          HXG_LINUX_IMAGE=/tmp/hxw/debian-test.qcow2 HXC_OUT=/tmp/hxg-e2e \
            bash horcrux-api/tests/hx_console_guest_e2e.sh target/debug/horcrux-api horcrux-api/horcrux-ui/dist 2>&1 | tee /tmp/hxg-e2e.log
          grep -E '^(LATENCY|RESULTS)' /tmp/hxg-e2e.log || true

      - name: Results
        if: always()
        run: |
          cat /tmp/hxg-e2e/guest-e2e.json 2>/dev/null || true
          rm -rf /tmp/hxw

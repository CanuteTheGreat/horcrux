name: Deploy Horcrux site

# Builds the static site (site/ + docs/ + branding/) and deploys it to the `horcrux-site` container on
# ollivanders, served as https://horcrux.errant.solutions (Cloudflare tunnel). Same rrsync + signed-drop + watcher
# pattern as ssherpa.app (ctg-infrastructure ollivanders/deploy-watchers). Builds NEVER run on ollivanders.
#
# Moving to its own domain later: the site uses only relative links. Serve the same image on the new
# host, then make this host answer with one 301 redirect, and change SITE_HOST below (verify step only).

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'docs/**'
      - 'branding/**'
      - 'keys/**'
      - 'SECURITY.md'
      - 'THIRD-PARTY-LICENSES.txt'
      - '.forgejo/workflows/deploy-site.yml'
  # Daily rebuild: picks up systemd ISOs that were published since the last deploy (the build lists a systemd
  # download only once its asset exists on the GitHub daily release). 18:30 UTC is after the nightly ISO slots.
  schedule:
    - cron: '30 18 * * *'
  workflow_dispatch: {}

env:
  SITE_HOST: horcrux.errant.solutions

concurrency:
  group: deploy-horcrux-site
  cancel-in-progress: false

jobs:
  deploy-site:
    runs-on: linux-cross-x86_64
    timeout-minutes: 25
    steps:
      - name: Install tools
        run: |
          apt-get update -qq
          apt-get install -y -qq rsync openssh-client jq curl python3 python3-markdown gnupg
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build the site and check every link
        run: |
          set -e
          python3 site/build.py
          python3 site/check.py
          echo "${{ github.sha }}" > site/dist/version.txt
      - name: Validate the nginx config
        run: |
          set -e
          docker build --platform linux/amd64 -t "horcrux-site-configtest:${{ github.sha }}" site
          docker run --rm "horcrux-site-configtest:${{ github.sha }}" nginx -t
          docker rmi "horcrux-site-configtest:${{ github.sha }}" >/dev/null
      - name: Build site image (linux/arm64 for ollivanders; COPY-only, no emulation)
        run: |
          set -e
          docker build --platform linux/arm64 -t "horcrux-site:${{ github.sha }}" site
          test "$(docker image inspect -f '{{.Architecture}}' "horcrux-site:${{ github.sha }}")" = arm64
      - name: Drop the signed image for ollivanders' watcher, then wait for its result
        env:
          OLLIVANDERS_DEPLOY_KEY: ${{ secrets.OLLIVANDERS_DEPLOY_KEY }}
          DEPLOY_SIGNING_KEY: ${{ secrets.DEPLOY_SIGNING_KEY }}
        run: |
          set -e
          umask 077
          printf '%s\n' "$OLLIVANDERS_DEPLOY_KEY" > /tmp/deploy_key
          trap 'rm -f /tmp/deploy_key /tmp/deploy_signing_key' EXIT
          RSH="ssh -i /tmp/deploy_key -p 2222 -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          DEST="canutethegreat@ollivanders.canutethegreat.com"
          TARBALL="/tmp/horcrux-site-${{ github.sha }}.tar.gz"
          docker save "horcrux-site:${{ github.sha }}" | gzip > "$TARBALL"
          printf '%s\n' "$DEPLOY_SIGNING_KEY" > /tmp/deploy_signing_key
          ssh-keygen -q -Y sign -f /tmp/deploy_signing_key -n ctg-deploy "$TARBALL"
          rm -f /tmp/deploy_signing_key
          rsync -av -e "$RSH" "$TARBALL.sig" "$DEST:pending/horcrux-site-${{ github.sha }}.tar.gz.sig"
          rsync -av -e "$RSH" "$TARBALL" "$DEST:pending/horcrux-site-${{ github.sha }}.tar.gz"
          rm -f "$TARBALL" "$TARBALL.sig"
          echo "Dropped; waiting for the watcher (polls every 10s)..."
          for i in $(seq 1 54); do
            sleep 10
            if ! rsync -I -e "$RSH" "$DEST:status-horcrux-site.json" /tmp/status.json 2>/tmp/status.err; then
              # Show why (this used to be silent: run 2376 waited 19 min although the watcher had finished in 10 s).
              [ $((i % 6)) = 1 ] && echo "status poll $i: rsync failed: $(tail -n 2 /tmp/status.err | tr '\n' ' ')" >&2
              continue
            fi
            if [ "$(jq -r .sha /tmp/status.json 2>/dev/null)" = "${{ github.sha }}" ]; then
              if [ "$(jq -r .status /tmp/status.json)" = "ok" ]; then echo "Watcher reports success."; exit 0; fi
              echo "Watcher reports failure: $(jq -r .reason /tmp/status.json)" >&2; exit 1
            fi
          done
          # The status file could not be read (or never carried this sha). Do not fail on that alone: the next step
          # checks that the live site serves this exact commit, and fails if it does not.
          echo "::warning::No status for ${{ github.sha }} from the watcher in 9 min; the live-site check below decides." >&2
          exit 0
      - name: Verify the live site serves this commit
        run: |
          # The tunnel can answer 502 for a short while after a container swap: retry ~3 min.
          check() {
            fail=0
            for p in "" roadmap/ stable-channel/ docs/ docs/iso-install/ assets/style.css robots.txt .well-known/security.txt signing-key.asc security/; do
              code=$(curl -s -o /dev/null -w '%{http_code}' -H 'Cache-Control: no-cache' "https://$SITE_HOST/$p")
              echo "$code https://$SITE_HOST/$p"; [ "$code" = 200 ] || fail=1
            done
            served=$(curl -s -H 'Cache-Control: no-cache' "https://$SITE_HOST/version.txt?ci=${{ github.run_id }}-$attempt" | tr -d '[:space:]')
            [ "$served" = "${{ github.sha }}" ] && echo "serves ${{ github.sha }}" || { echo "version.txt is '$served'" >&2; fail=1; }
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://$SITE_HOST/no-such-page-qa")
            [ "$code" = 404 ] || { echo "404 page answered $code" >&2; fail=1; }
            return $fail
          }
          for attempt in $(seq 1 18); do
            echo "--- verify attempt $attempt/18"
            if check; then exit 0; fi
            [ "$attempt" = 18 ] || sleep 10
          done
          echo "$SITE_HOST not serving this commit after ~3 min" >&2; exit 1

  # Purge this site's Cloudflare cache once the deploy and the live check succeeded. A failure here goes red
  # AFTER the site is live. CF_PURGE_TOKEN = Cloudflare API token limited to Zone > Cache Purge on the
  # errant.solutions zone; CF_ZONE_ID = that zone (repo Actions secrets).
  purge-cloudflare:
    needs: [deploy-site]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: arm64-light
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Purge Cloudflare cache (retries 429/5xx)
        env:
          CF_PURGE_TOKEN: ${{ secrets.CF_PURGE_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
        run: |
          command -v curl >/dev/null || { apt-get update -qq && apt-get install -y -qq curl; }
          bash .forgejo/scripts/cf-purge.sh

  # Ping IndexNow (Bing, Yandex, Seznam, Naver) with the sitemap URLs after a live deploy. Never fails the run.
  indexnow:
    needs: [purge-cloudflare]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: arm64-light
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Submit sitemap URLs to IndexNow
        run: |
          command -v curl >/dev/null || { apt-get update -qq && apt-get install -y -qq curl; }
          bash .forgejo/scripts/indexnow.sh horcrux.errant.solutions 5bd2340b776c5d0b43933a1f02f4281e

  # Standby twin: the same image built for linux/amd64 on an x86 runner and
  # published, signed (namespace ctg-standby), to the standby image store as horcrux/horcrux-site/<tag>.tar.zst, so the
  # standby host can run this app if the arm64 production host is gone. Runs only after the deploy above; never touches the
  # deploy target. ci/standby-image.py is a verbatim copy of the standby tooling's client.
  standby-amd64:
    needs: deploy-site
    if: github.ref == 'refs/heads/main'
    runs-on: colo-light-x86_64
    timeout-minutes: 30
    steps:
      - name: Install tools
        run: |
          apt-get update -qq
          apt-get install -y -qq zstd openssh-client python3 python3-markdown gnupg >/dev/null
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Already published?
        id: have
        env:
          STANDBY_S3_URL: ${{ secrets.STANDBY_S3_URL }}
          STANDBY_S3_KEY_ID: ${{ secrets.STANDBY_S3_KEY_ID }}
          STANDBY_S3_KEY: ${{ secrets.STANDBY_S3_KEY }}
        run: |
          if python3 ci/standby-image.py exists "horcrux/horcrux-site" "${{ github.sha }}"; then echo "skip=1" >> "$GITHUB_OUTPUT"; echo "already stored"; else echo "skip=0" >> "$GITHUB_OUTPUT"; fi
      - name: Build the site (same as the deploy job)
        if: steps.have.outputs.skip != '1'
        run: |
          set -e
          python3 site/build.py
          echo "${{ github.sha }}" > site/dist/version.txt
      - name: Build linux/amd64 image
        if: steps.have.outputs.skip != '1'
        run: |
          set -e
          docker build --platform linux/amd64 -t "horcrux-site:${{ github.sha }}-amd64" site
          test "$(docker image inspect -f '{{.Architecture}}' "horcrux-site:${{ github.sha }}-amd64")" = amd64
      - name: Publish to the standby image store
        if: steps.have.outputs.skip != '1'
        env:
          STANDBY_S3_URL: ${{ secrets.STANDBY_S3_URL }}
          STANDBY_S3_KEY_ID: ${{ secrets.STANDBY_S3_KEY_ID }}
          STANDBY_S3_KEY: ${{ secrets.STANDBY_S3_KEY }}
          STANDBY_SIGNING_KEY: ${{ secrets.DEPLOY_SIGNING_KEY }}
        run: python3 ci/standby-image.py publish "horcrux-site:${{ github.sha }}-amd64" "horcrux/horcrux-site" "${{ github.sha }}"
      - name: Remove this run's image
        if: always()
        run: docker image rm "horcrux-site:${{ github.sha }}-amd64" >/dev/null 2>&1 || true

name: Release

# Release binaries for the "also runs on any modern distro" path. Gentoo
# (gentoo/app-emulation/horcrux, USE flags) remains the primary install.
#
# A v* tag builds every target and attaches the tarballs to that tag's
# Forgejo release (.forgejo/scripts/publish-release-assets.sh). A manual
# workflow_dispatch run builds and packages everything without publishing:
# use it to prove a release would build before tagging.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-release:
    name: Build Release
    runs-on: linux-cross-x86_64
    # Same multi-arch job image as ci.yml (the runner default is not pinned).
    container: catthehacker/ubuntu:act-latest
    strategy:
      fail-fast: false
      matrix:
        # *-gnu: CLI + server (all features). The server links libvirt
        # (feature qemu) and libpam (feature pam); release-build.sh installs
        # them for the target architecture (Ubuntu multiarch + cross gcc).
        # *-musl: static CLI only - glibc's libvirt/libpam can't be linked
        # into a musl binary, and the server without them has no QEMU VMs.
        include:
          - target: x86_64-unknown-linux-gnu
          - target: aarch64-unknown-linux-gnu
          - target: riscv64gc-unknown-linux-gnu
          - target: x86_64-unknown-linux-musl
          - target: aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: https://github.com/dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-${{ matrix.target }}-

      - name: Build CLI + API server
        run: bash .forgejo/scripts/release-build.sh ${{ matrix.target }}

      - name: Create archive
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/horcrux dist/
          # musl targets ship the CLI only (see the matrix comment).
          if [ -f target/${{ matrix.target }}/release/horcrux-api ]; then
            cp target/${{ matrix.target }}/release/horcrux-api dist/
          fi
          cp README.md LICENSE dist/ 2>/dev/null || true
          cp -r docs dist/ 2>/dev/null || true
          cp config.example.toml dist/ 2>/dev/null || true
          cd dist
          tar -czvf ../horcrux-${{ github.ref_name }}-${{ matrix.target }}.tar.gz *
          ls -l ../horcrux-${{ github.ref_name }}-${{ matrix.target }}.tar.gz

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          FORGEJO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .forgejo/scripts/publish-release-assets.sh horcrux-${{ github.ref_name }}-${{ matrix.target }}.tar.gz

  build-ui-release:
    name: Build Web UI Release
    runs-on: linux-cross-x86_64
    container: catthehacker/ubuntu:act-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: https://github.com/dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install trunk
        # Prebuilt binary: `cargo install trunk` fails to compile
        # (lightningcss pulls two incompatible cssparser versions; see the
        # same step in ci.yml).
        run: |
          curl -fsSL "https://github.com/trunk-rs/trunk/releases/latest/download/trunk-x86_64-unknown-linux-gnu.tar.gz" | tar xzf -
          sudo mv trunk /usr/local/bin/trunk
          trunk --version

      - name: Build UI
        # The real web UI is the workspace member horcrux-api/horcrux-ui (the
        # one ci.yml's "Build Web UI" job and the Gentoo ebuilds build). The
        # top-level horcrux-ui/ directory is a stale, non-workspace copy last
        # touched in 133e8a0 -- it still hardcodes ws://localhost:8006 and
        # lacks every UI fix since, so releases must not package it.
        working-directory: horcrux-api/horcrux-ui
        run: trunk build --release

      - name: Create archive
        run: |
          cd horcrux-api/horcrux-ui/dist
          tar -czvf ../../../horcrux-ui-${{ github.ref_name }}.tar.gz *

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          FORGEJO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .forgejo/scripts/publish-release-assets.sh horcrux-ui-${{ github.ref_name }}.tar.gz

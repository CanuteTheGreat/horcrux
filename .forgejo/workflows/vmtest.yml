name: vmtest (multi-VM framework)

# Shared nixosTest-style QEMU framework (tools/vmtest, docs/design/vmtest.md). Gates: pure-python unit tests, the 3-node
# OpenRC selftest (boot, init-agnostic unit API, partition/heal/loss/cable-pull, snapshot, power cut, screenshot), a negative
# run that must FAIL and still leave its evidence, and the Horcrux install-smoke port of qemu-test.py --flow auto.
on:
  push:
    branches: [main, 'feat/vmtest*']
    paths:
      - 'tools/vmtest/**'
      - 'docs/design/vmtest.md'
      - '.forgejo/workflows/vmtest.yml'
  workflow_dispatch: {}

concurrency:
  group: "replace:${{ github.workflow }}@${{ github.ref }}"
  cancel-in-progress: false

jobs:
  vmtest:
    name: vmtest selftest + install smoke (KVM)
    runs-on: kvm-x86_64
    container: catthehacker/ubuntu:act-latest
    timeout-minutes: 90
    env:
      VMTEST_CACHE: /tmp/vmtest-cache
      OUT: /tmp/vmtest-out
    steps:
      - uses: actions/checkout@v4

      - name: Host deps
        run: |
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends qemu-system-x86 qemu-utils ovmf python3 curl ca-certificates openssh-client e2fsprogs openssl >/dev/null
          ls -l /dev/kvm || echo "no /dev/kvm: guests run under TCG (x4 timeouts)"

      - name: Unit tests (no QEMU)
        run: python3 -m unittest discover -s tools/vmtest/tests -v

      - name: Selftest - 3 OpenRC guests on a hub
        run: cd tools/vmtest && python3 -u -m vmtest run scenarios/selftest_alpine.py --out $OUT/selftest

      - name: Negative test - a failing scenario must fail and leave evidence
        run: |
          cd tools/vmtest
          if python3 -u -m vmtest run scenarios/selftest_alpine.py --arg fail=1 --out $OUT/negative; then echo "::error::the deliberate failure passed"; exit 1; fi
          for f in result.json n1/failure-screen.png n1/guest-init-diag.txt n1/guest-net.txt net-lan.pcap net-lan.events.txt; do
            test -s $OUT/negative/$f || { echo "::error::missing failure evidence $f"; ls -R $OUT/negative | head -40; exit 1; }
          done
          ls $OUT/negative/n1 | grep -q serial.log
          python3 -c "import json;r=json.load(open('$OUT/negative/result.json'));assert r['ok'] is False and r['error'], r"
          echo "evidence collected:"; ls $OUT/negative $OUT/negative/n1

      - name: Install smoke - unattended Horcrux install from the daily ISO (UEFI + USB)
        run: |
          curl -fsSL --retry 3 -o /tmp/horcrux.iso https://github.com/CanuteTheGreat/horcrux/releases/download/daily/horcrux-server-openrc-daily-x86_64.iso
          cd tools/vmtest && python3 -u -m vmtest run scenarios/install_smoke.py --arg iso=/tmp/horcrux.iso --out $OUT/install-smoke

      - name: Evidence (always)
        if: always()
        run: |
          for d in $OUT/*/; do echo "== $d"; cat $d/result.json 2>/dev/null | head -c 3000; done
          for f in $OUT/*/*/*-serial.log; do [ -f "$f" ] && { echo "== tail $f"; tail -c 1500 "$f" | tr -d '\r'; }; done 2>/dev/null | head -150 || true

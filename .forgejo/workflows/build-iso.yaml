# Horcrux ISO Build Workflow
#
# Builds the minimal live/installer ISO with build/scripts/build-iso.sh.
#
# x86_64 only: build-iso.sh assembles the ISO's root filesystem from the
# BUILD HOST's own kernel, busybox/bash and shared libraries, so on this
# x86_64 runner it can only produce a correct x86_64 image (an "aarch64" or
# "riscv64" ISO built here would carry x86_64 userland and kernel). The
# Gentoo-native image (all architectures, catalyst) is built with
# build/docker/build-iso-docker.sh / `make -C build gentoo`.
#
# Manual runs only (workflow_dispatch): this minimal busybox image is a build-script
# smoke test, NOT an installable system. The real live/installer ISO (Gentoo, UEFI+BIOS,
# installer included) is built, tested and published by live-iso.yml (daily + v* tags).

name: Build ISOs

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type (minimal, standard, full)'
        required: false
        default: 'standard'

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build-iso:
    name: Build x86_64 ISO
    runs-on: linux-cross-x86_64
    container: catthehacker/ubuntu:act-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: https://github.com/dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Install ISO build dependencies
        # linux-image-generic: build-iso.sh boots the ISO with the build
        # host's kernel (/boot/vmlinuz-*); a job container has none.
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            squashfs-tools xorriso grub-pc-bin grub-efi-amd64-bin grub-common \
            cpio mtools dosfstools busybox-static file zstd xz-utils linux-image-generic \
            qemu-system-x86

      - name: Build Horcrux binaries (CLI + API, libvirt + PAM)
        env:
          HORCRUX_API_FEATURES: ${{ (github.event.inputs.build_type || 'standard') == 'full' && '--features kubernetes' || '' }}
        run: bash .forgejo/scripts/release-build.sh x86_64-unknown-linux-gnu

      - name: Build ISO
        env:
          PREBUILT_BINARIES: 'true'
        run: |
          cd build
          sudo -E env "PATH=$PATH" ./scripts/build-iso.sh \
            -a x86_64 \
            -t ${{ github.event.inputs.build_type || 'standard' }} \
            -o "$PWD/iso"
          ls -l iso

      - name: Boot the ISO (live init, writable /dev /run /tmp /var, version)
        run: bash ci/iso-boot-smoke.sh build/iso/*.iso


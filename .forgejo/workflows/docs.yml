name: Documentation

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'horcrux-api/src/**'
      - '.forgejo/workflows/docs.yml'

jobs:
  build-docs:
    name: Build Documentation
    runs-on: x86_64
    # Pin to a multi-arch tag (not a single-platform sha256 digest) so
    # this job succeeds regardless of which x86_64-labeled runner picks
    # it up. Confirmed 2026-10-04: a second runner registered under the
    # x86_64 label (id 74716d47, version:dev) explicitly requests
    # platform=linux/arm64 for its job containers, but the runner-default
    # image is pinned by sha256 digest to a single-platform (amd64-only)
    # manifest, so "docker create" fails with "image ... does not provide
    # the specified platform (linux/arm64)" every time that runner wins
    # the race against the working beauxbatons runner (~every other run).
    # act-latest is a real multi-arch manifest list, so either runner can
    # pull the variant matching whatever platform it actually requests.
    container: catthehacker/ubuntu:act-latest
    # Fail fast instead of silently consuming the full 3h runner timeout
    # (observed 2026-10-01: run 144/job 5438 ran for exactly 3h00m01s before
    # being cancelled) -- a docs-only job has no business needing anywhere
    # near that long, and with the artifact upload step removed (see
    # below), a longer-than-expected rustdoc build is the only
    # meaningful signal left to catch here.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: https://github.com/dtolnay/rust-toolchain@stable

      - name: Install build tools
        # Must match ci.yml's apt-get install (build-essential + libvirt-dev):
        # cargo doc --all-features still compiles the virt/qemu feature's
        # libvirt FFI bindings even though --no-deps skips generating their
        # doc pages, so the libvirt headers are required here too or the
        # build fails outright. Missing libvirt-dev here (while every other
        # workflow job that touches --all-features installs it) was the
        # actual root cause of this job's recurring failures.
        run: sudo apt-get update && sudo apt-get install -y build-essential libvirt-dev

      - name: Ensure Node.js is present (self-heal)
        # Same root cause as ci.yml's identical step (added in fb065bd):
        # catthehacker/ubuntu:act-latest job containers on the beauxbatons
        # runner are reused across runs rather than recreated per-job, and
        # node has been observed vanishing mid-job (after an apt-get
        # install of unrelated packages) between 2026-10-04 and
        # 2026-10-05, breaking every JS action (actions/cache,
        # actions/checkout's post step) for the rest of the job. This job
        # has the identical "Install build tools" -> "Cache cargo
        # registry" shape as ci.yml's jobs but was missed when that fix
        # landed, and failed with the same "Cache cargo registry" step
        # dying in 0s on 2026-10-05. Root cause is the runner's container
        # lifecycle (outside this repo); self-heal cheaply here too.
        run: |
          if ! command -v node >/dev/null 2>&1; then
            echo "::warning::node missing from job container PATH - reinstalling"
            sudo apt-get update -qq
            sudo apt-get install -y nodejs
          fi
          node --version

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-docs-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-docs-

      - name: Build rustdoc
        run: cargo doc --no-deps --all-features --workspace

      - name: Prepare docs
        run: |
          mkdir -p public
          cp -r target/doc/* public/
          cp -r docs/* public/ 2>/dev/null || true
          echo '<meta http-equiv="refresh" content="0; url=horcrux_api/index.html">' > public/index.html

      # DROPPED the "Upload docs artifact" step (2026-10-02): the Forgejo
      # artifact storage backend has now hard-failed the upload on every
      # single run since 2026-09-24 (HTTP 500 on finalize, after ~10-15min
      # of retries - see run 2345/job 11033 and run 144/job 5438 before
      # it), and confirmed this run that `continue-on-error: true` does
      # NOT actually protect the job here: actions/upload-artifact@v3's
      # finalize-upload failure path exits the step in a way the runner
      # still reports as an overall job failure, bypassing
      # continue-on-error entirely (two separate "fixes" relying on
      # continue-on-error have now both failed the same way). Since the
      # horcrux-docs artifact was purely informational and consumed by no
      # other workflow (release.yml/build-iso.yaml pull different
      # artifacts), the only remaining value of this job is the rustdoc
      # build itself as a compile-check - so stop uploading and let this
      # job report real pass/fail on that alone. Revisit if/when the
      # instance gets real GitHub-Pages-equivalent artifact hosting.

name: Documentation

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'horcrux-api/src/**'
      - '.forgejo/workflows/docs.yml'

jobs:
  build-docs:
    name: Build Documentation
    runs-on: x86_64
    # Fail fast instead of silently consuming the full 3h runner timeout
    # (observed 2026-10-01: run 144/job 5438 ran for exactly 3h00m01s before
    # being cancelled) -- a docs-only job has no business needing anywhere
    # near that long, and continue-on-error on the artifact upload step
    # already means a longer-than-expected rustdoc build is the only
    # meaningful signal left to catch here.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: https://github.com/dtolnay/rust-toolchain@stable

      - name: Install build tools
        # Must match ci.yml's apt-get install (build-essential + libvirt-dev):
        # cargo doc --all-features still compiles the virt/qemu feature's
        # libvirt FFI bindings even though --no-deps skips generating their
        # doc pages, so the libvirt headers are required here too or the
        # build fails outright. Missing libvirt-dev here (while every other
        # workflow job that touches --all-features installs it) was the
        # actual root cause of this job's recurring failures.
        run: sudo apt-get update && sudo apt-get install -y build-essential libvirt-dev

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-docs-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-docs-

      - name: Build rustdoc
        run: cargo doc --no-deps --all-features --workspace

      - name: Prepare docs
        run: |
          mkdir -p public
          cp -r target/doc/* public/
          cp -r docs/* public/ 2>/dev/null || true
          echo '<meta http-equiv="refresh" content="0; url=horcrux_api/index.html">' > public/index.html

      # This Forgejo instance has no GitHub-Pages-equivalent hosting product
      # (upload-pages-artifact/deploy-pages are GHES-only APIs Forgejo does
      # not implement - confirmed via GHESNotSupportedError in CI, 2026-09-25).
      # v4+ artifact actions ALSO require the newer @actions/artifact API,
      # which this runner does not support (GHESNotSupportedError again).
      # v3 uses the older, supported artifact API - use that instead.
      # This artifact upload has been observed hard-failing (HTTP 500 on
      # finalize, after ~10-15min of retries) on the Forgejo instance's
      # artifact storage backend on essentially every run since 2026-09-24
      # -- server-side infra flakiness, not a workflow bug. The
      # horcrux-docs artifact is also not consumed by any other workflow
      # (release.yml/build-iso.yaml download different artifacts), so it
      # is purely informational. continue-on-error keeps the actual rustdoc
      # build (the part with real signal) from being masked by an
      # unrelated storage-backend outage, while still surfacing upload
      # failures in the step summary if/when the backend recovers.
      - name: Upload docs artifact
        uses: actions/upload-artifact@v3
        continue-on-error: true
        with:
          name: horcrux-docs
          path: public

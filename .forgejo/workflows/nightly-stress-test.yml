name: Nightly Stress / Adversarial Test

# This is deliberately separate from nightly-realistic-test.yml (one VM
# boots once, one container lifecycle, one pair of namespaces ping each
# other - a basic "does the real thing happen at all" check) and from
# ci.yml (fast per-push checks). This workflow goes further: concurrency,
# two independent networks with a real negative (isolation) assertion,
# out-of-band failure injection against the real system, and several
# minutes of sustained concurrent HTTP load against a live horcrux-api
# server - the "poke it with a stick" suite. Expensive and noisy by
# design, so schedule + manual dispatch only, never on push/PR.
on:
  workflow_dispatch: {}
  schedule:
    # 10:00 UTC == ~03:00 America/Los_Angeles, an hour after
    # nightly-realistic-test.yml's 09:00 UTC slot so they don't fight over
    # the same Docker Desktop daemon / CNI bridge devices on beauxbatons.
    - cron: '0 10 * * *'

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  stress-test:
    name: Concurrent VM/container fleet + isolation + failure-injection + load test
    # Same dedicated runner as nightly-realistic-test.yml and for the same
    # reason: real Docker Desktop daemon (genuine Linux kernel, real
    # netns/veth/CNI) on beauxbatons, reached via the x86_64-labeled
    # Forgejo runner fleet - never ubuntu-latest (shared AWS ASG fleet,
    # see rustinion-ci-infra-map skill).
    runs-on: x86_64
    container: catthehacker/ubuntu:act-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Ensure Node.js is present (self-heal)
        # This job's container (catthehacker/ubuntu:act-latest) is reused
        # by the beauxbatons runner across many job runs instead of being
        # recreated per-run (confirmed via `docker ps -a` in a prior failed
        # run showing other jobs' containers still alive hours later). On
        # 2026-10-05 node vanished mid-job from a long-lived container
        # between the "Verify tool versions" and "Cache cargo registry"
        # steps, breaking actions/cache and actions/checkout's post step
        # (both are JS actions that shell out to `node`). Root cause is a
        # runner/container-lifecycle issue outside this repo, but we can
        # cheaply self-heal here rather than fail the whole nightly run.
        # Same fix already landed in ci.yml, docs.yml, and
        # nightly-realistic-test.yml; run 227 (2026-10-07) hit the
        # identical failure here because this workflow never got it.
        run: |
          if ! command -v node >/dev/null 2>&1; then
            echo "::warning::node missing from job container PATH - reinstalling (see container-reuse note in this step)"
            sudo apt-get update -qq
            sudo apt-get install -y nodejs
          fi
          node --version

      - name: Install Rust toolchain
        uses: https://github.com/dtolnay/rust-toolchain@stable

      - name: Install build deps, CNI plugins, and net tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential libvirt-dev \
            containernetworking-plugins \
            iproute2 iputils-ping curl jq

          if [ -d /usr/lib/cni ]; then
            echo "NIGHTLY_CNI_BIN_DIR=/usr/lib/cni" >> "$GITHUB_ENV"
          elif [ -d /opt/cni/bin ]; then
            echo "NIGHTLY_CNI_BIN_DIR=/opt/cni/bin" >> "$GITHUB_ENV"
          else
            echo "No CNI plugin binaries found after install" >&2
            exit 1
          fi

      - name: Pre-pull real container images used by the stress fleet
        # nginx:alpine (long-running, so `docker ps` reports it as
        # genuinely "running") and alpine:latest (fast create/delete churn
        # for the load test) - pulled once up front so neither the fleet
        # boot nor the load test pay first-pull latency mid-measurement.
        run: |
          docker pull nginx:alpine
          docker pull alpine:latest

      - name: Verify tool versions (docker, CNI)
        run: |
          docker version
          ls -la "$NIGHTLY_CNI_BIN_DIR"

      - name: Ensure Node.js is present (self-heal, pre-cache)
        # Second check, right before the next node-dependent (JS) action.
        # Same reasoning as the earlier self-heal step above; this is the
        # exact point (just before actions/cache) where run 227
        # (2026-10-07) actually failed with "node: executable file not
        # found in $PATH".
        run: |
          if ! command -v node >/dev/null 2>&1; then
            echo "::warning::node missing from job container PATH - reinstalling (see container-reuse note in this step)"
            sudo apt-get update -qq
            sudo apt-get install -y nodejs
          fi
          node --version

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-stress-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-stress-
            ${{ runner.os }}-cargo-nightly-
            ${{ runner.os }}-cargo-

      - name: Probe mount-namespace capability (fail-soft, not fail-fast)
        # Known, already-investigated environment limitation on this
        # runner (see nightly-realistic-test.yml's "Preflight" step and
        # commits 4a5ab32/c7abfee): `ip netns add` needs CLONE_NEWNS, and
        # Docker Desktop's Enhanced Container Isolation (or an equivalent
        # seccomp/AppArmor profile) denies it outright for job containers
        # on beauxbatons - confirmed via `unshare --mount` itself failing
        # with a flat "Operation not permitted", not an ownership nuance
        # workaroundable from inside the container. That's a host/runner
        # config decision for the owner, not something any workflow-level
        # trick can fix.
        #
        # Unlike nightly-realistic-test.yml (where the CNI test is the
        # ENTIRE point of the job, so failing fast makes sense), this
        # workflow has four other independent scenarios that don't need
        # netns at all (concurrent fleet, failure injection, sustained
        # load, serial-console-gap). So this probe is fail-SOFT: it
        # records the result and the CNI isolation step below skips
        # itself with a clear message instead of taking the whole job
        # down, so the other scenarios still get a real pass/fail result
        # every run regardless of this host limitation.
        run: |
          if unshare --mount --propagation private -- true 2>/tmp/unshare-probe.err; then
            echo "NIGHTLY_NETNS_OK=true" >> "$GITHUB_ENV"
            echo "mount-namespace capability available"
          else
            echo "NIGHTLY_NETNS_OK=false" >> "$GITHUB_ENV"
            echo "::warning::unshare --mount is blocked on this runner ($(tr -d '\n' < /tmp/unshare-probe.err)) - CLONE_NEWNS is denied for job containers on beauxbatons (Docker Desktop Enhanced Container Isolation or equivalent). The CNI cross-network isolation test needs 'ip netns' and cannot run here until the host/runner config is changed by the owner; it will be skipped (not faked as a pass) this run. All other stress scenarios are unaffected and will still run."
          fi

      - name: Run concurrent container fleet test
        run: |
          cargo test --test nightly_stress_tests -p horcrux-api \
            -- --ignored --test-threads=1 --nocapture \
            test_concurrent_container_fleet

      - name: Run CNI cross-network isolation test
        if: env.NIGHTLY_NETNS_OK == 'true'
        env:
          NIGHTLY_CNI_CONF_DIR: /tmp/horcrux-stress/cni-conf
        run: |
          cargo test --test nightly_stress_tests -p horcrux-api \
            -- --ignored --test-threads=1 --nocapture \
            test_cni_network_partition_isolation

      - name: Skip notice - CNI cross-network isolation test
        if: env.NIGHTLY_NETNS_OK != 'true'
        run: |
          echo "SKIPPED test_cni_network_partition_isolation: this runner denies CLONE_NEWNS (ip netns unavailable in this container). See the 'Probe mount-namespace capability' step above for the full explanation. This is an environment limitation, not a passing or faked result."

      - name: Run failure-injection / reconciliation test
        run: |
          cargo test --test nightly_stress_tests -p horcrux-api \
            -- --ignored --test-threads=1 --nocapture \
            test_failure_injection_and_reconciliation

      - name: Build horcrux-api server (for load + serial-console-gap tests)
        run: cargo build --all-features -p horcrux-api --bin horcrux-api

      - name: Start a dedicated horcrux-api server for load testing
        # Deliberately a different port (8007) and data dir from ci.yml's
        # integration_tests.rs server (8006 / /tmp/horcrux-ci-data), so
        # this workflow can never collide with ci.yml if they ever
        # overlap on the same runner.
        run: |
          mkdir -p /tmp/horcrux-stress-data
          mkdir -p /tmp/horcrux-stress-cni/bin /tmp/horcrux-stress-cni/conf.d
          HORCRUX_HOST=127.0.0.1 \
          HORCRUX_PORT=8007 \
          HORCRUX_DATA_DIR=/tmp/horcrux-stress-data \
          HORCRUX_DATABASE_URL="sqlite:///tmp/horcrux-stress-data/horcrux.db" \
          HORCRUX_CNI_BIN_DIR=/tmp/horcrux-stress-cni/bin \
          HORCRUX_CNI_CONF_DIR=/tmp/horcrux-stress-cni/conf.d \
          ADMIN_PASSWORD=admin \
          RATE_LIMIT_MAX_REQUESTS=1000000 \
          RUST_LOG=info \
          nohup ./target/debug/horcrux-api > /tmp/horcrux-stress-api.log 2>&1 &
          echo $! > /tmp/horcrux-stress-api.pid

          echo "Waiting for horcrux-api to become healthy..."
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8007/api/health > /dev/null 2>&1; then
              echo "horcrux-api is up (pid $(cat /tmp/horcrux-stress-api.pid))"
              exit 0
            fi
            sleep 1
          done
          echo "horcrux-api did not become healthy in time" >&2
          cat /tmp/horcrux-stress-api.log >&2
          exit 1

      - name: Run sustained concurrent load test against the live server
        # 150s * 6 concurrent workers * 2 ops/iteration (create+delete),
        # each iteration is a real HTTP round trip plus two real `docker`
        # invocations server-side - this runs dozens of real create/delete
        # cycles well within the timeout-minutes budget, continuously
        # polling /api/health in parallel the whole time.
        env:
          NIGHTLY_STRESS_API_BASE: http://127.0.0.1:8007/api
          NIGHTLY_STRESS_API_PIDFILE: /tmp/horcrux-stress-api.pid
          NIGHTLY_STRESS_LOAD_SECONDS: "150"
          NIGHTLY_STRESS_LOAD_CONCURRENCY: "6"
        run: |
          cargo test --test nightly_stress_tests -p horcrux-api \
            -- --ignored --test-threads=1 --nocapture \
            test_sustained_concurrent_api_load

      - name: Run serial-console-gap check against the live server
        env:
          NIGHTLY_STRESS_API_BASE: http://127.0.0.1:8007/api
        run: |
          cargo test --test nightly_stress_tests -p horcrux-api \
            -- --ignored --test-threads=1 --nocapture \
            test_serial_console_route_not_wired_yet

      - name: Dump horcrux-api server log
        if: always()
        run: cat /tmp/horcrux-stress-api.log || true

      - name: Stop horcrux-api server
        if: always()
        run: |
          if [ -f /tmp/horcrux-stress-api.pid ]; then
            kill "$(cat /tmp/horcrux-stress-api.pid)" 2>/dev/null || true
          fi

      - name: Diagnostics on failure
        if: failure()
        run: |
          echo "--- docker ps -a ---"
          docker ps -a || true
          echo "--- leftover netns ---"
          ip netns list || true
          echo "--- leftover bridges ---"
          ip link show type bridge || true

      - name: Clean up resources (backstop - tests clean up their own)
        if: always()
        run: |
          rm -rf /tmp/horcrux-stress /tmp/horcrux-stress-data /tmp/horcrux-stress-cni
          rm -f /tmp/horcrux-stress-api.pid /tmp/horcrux-stress-api.log
          docker ps -a --filter "name=horcrux-stress" -q | xargs -r docker rm -f || true
          for ns in hcx-stress-a1 hcx-stress-a2 hcx-stress-b1 hcx-stress-b2; do
            ip netns del "$ns" 2>/dev/null || true
          done
          ip link del hcx-stress-brA 2>/dev/null || true
          ip link del hcx-stress-brB 2>/dev/null || true
          df -h / || true

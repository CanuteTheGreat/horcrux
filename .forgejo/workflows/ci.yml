name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Branches/PRs: a new push cancels the older run. main: runs queue and
  # each one finishes. With several agents pushing to main every ~40 min
  # and the shared runners' queue longer than that, cancelling on main
  # meant no CI run on main ever started (six in a row cancelled while
  # still waiting for a runner, 2026-10-17). Only one main run executes
  # at a time either way, so this adds no concurrent load.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    name: Check
    runs-on: linux-cross-x86_64
    # Pin to a multi-arch tag (not a single-platform sha256 digest) so
    # this job succeeds regardless of which x86_64-labeled runner picks
    # it up. Confirmed 2026-10-04: a second runner registered under the
    # x86_64 label (id 74716d47, version:dev) explicitly requests
    # platform=linux/arm64 for its job containers, but the runner-default
    # image is pinned by sha256 digest to a single-platform (amd64-only)
    # manifest, so "docker create" fails with "image ... does not provide
    # the specified platform (linux/arm64)" every time that runner wins
    # the race against the working beauxbatons runner (~every other run).
    # act-latest is a real multi-arch manifest list, so either runner can
    # pull the variant matching whatever platform it actually requests.
    container: catthehacker/ubuntu:act-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: https://github.com/dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential libvirt-dev libpam0g-dev

      - name: Ensure Node.js is present (self-heal)
        # catthehacker/ubuntu:act-latest job containers on the beauxbatons
        # runner are reused across runs rather than recreated per-job, and
        # node has been observed vanishing mid-job (after an apt-get
        # install of unrelated packages) between 2026-10-04 and
        # 2026-10-05, breaking every JS action (actions/cache,
        # actions/checkout's post step) for the rest of the job. Root
        # cause is the runner's container lifecycle (outside this repo);
        # self-heal cheaply here rather than fail the whole job.
        run: |
          if ! command -v node >/dev/null 2>&1; then
            echo "::warning::node missing from job container PATH - reinstalling"
            sudo apt-get update -qq
            sudo apt-get install -y nodejs
          fi
          node --version

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: Test
    runs-on: linux-cross-x86_64
    # Pin to a multi-arch tag (not a single-platform sha256 digest) so
    # this job succeeds regardless of which x86_64-labeled runner picks
    # it up. Confirmed 2026-10-04: a second runner registered under the
    # x86_64 label (id 74716d47, version:dev) explicitly requests
    # platform=linux/arm64 for its job containers, but the runner-default
    # image is pinned by sha256 digest to a single-platform (amd64-only)
    # manifest, so "docker create" fails with "image ... does not provide
    # the specified platform (linux/arm64)" every time that runner wins
    # the race against the working beauxbatons runner (~every other run).
    # act-latest is a real multi-arch manifest list, so either runner can
    # pull the variant matching whatever platform it actually requests.
    container: catthehacker/ubuntu:act-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: https://github.com/dtolnay/rust-toolchain@stable

      - name: Install build tools
        # qemu-system-x86 / qemu-utils give the integration suite real
        # qemu-img and qemu-system-x86_64 binaries: without them, VM
        # creation (qemu-img), storage-pool/snapshot validation, and
        # VM start (needed for the console/VNC tests) all fail even
        # though the server itself starts fine.
        #
        # console_tests.rs boots real VMs and speaks VNC, SPICE (with
        # audio + usbredir channels) and serial to them: SPICE and the
        # SPICE audio backend are separate module packages on Ubuntu 24.04+
        # (built into qemu-system-x86 on older releases), and qxl needs
        # its VGA BIOS from the qemu firmware packages.
        run: |
          sudo apt-get update
          spice_mods=""
          if apt-cache show qemu-system-modules-spice >/dev/null 2>&1; then
            spice_mods="qemu-system-modules-spice"
          fi
          sudo apt-get install -y build-essential libvirt-dev libpam0g-dev qemu-system-x86 qemu-system-arm qemu-utils zstd $spice_mods
          # Fail here, not deep in a test, if this QEMU can't do SPICE.
          qemu-system-x86_64 --version
          qemu-system-x86_64 -audiodev help | grep -qx spice || { echo "qemu-system-x86_64 lacks SPICE (no spice audiodev)" >&2; exit 1; }

      - name: Ensure Node.js is present (self-heal)
        # catthehacker/ubuntu:act-latest job containers on the beauxbatons
        # runner are reused across runs rather than recreated per-job, and
        # node has been observed vanishing mid-job (after an apt-get
        # install of unrelated packages) between 2026-10-04 and
        # 2026-10-05, breaking every JS action (actions/cache,
        # actions/checkout's post step) for the rest of the job. Root
        # cause is the runner's container lifecycle (outside this repo);
        # self-heal cheaply here rather than fail the whole job.
        run: |
          if ! command -v node >/dev/null 2>&1; then
            echo "::warning::node missing from job container PATH - reinstalling"
            sudo apt-get update -qq
            sudo apt-get install -y nodejs
          fi
          node --version

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build horcrux-api server (for integration tests)
        run: cargo build --all-features -p horcrux-api --bin horcrux-api

      - name: Start horcrux-api server
        # integration_tests.rs (horcrux-api/tests/) is a real end-to-end
        # suite: it talks to a live server over HTTP at localhost:8006
        # (see API_BASE in the test file), it doesn't spin one up itself.
        # `cargo test --workspace` never starts that server, so every one
        # of those 22 tests was failing on "connection refused" in CI.
        # Point the server at throwaway /tmp paths so it doesn't need
        # root to create /var/lib/horcrux or /var/log/horcrux, then wait
        # for /api/health before letting the test steps run.
        #
        # HORCRUX_CNI_BIN_DIR/HORCRUX_CNI_CONF_DIR redirect CNI network
        # tests away from the real /opt/cni/bin (/etc/cni/net.d), which
        # don't exist and aren't writable on an unprivileged runner - the
        # CNI bin dir just needs to exist for CNI to be considered
        # "enabled"; the conf dir is where CniManager writes .conflist
        # files it creates via the API.
        #
        # test_backup_operations and test_storage_snapshots hardcode
        # "/var/lib/horcrux/..." storage paths directly in the test file
        # (they're exercising the same paths a real deployment would use,
        # not test-owned throwaway ones), so those two directories need to
        # actually exist and be writable by the runner user - create and
        # chown them with sudo rather than editing the test file.
        #
        # Start from an empty data dir: configuration (pools, firewall, HA,
        # jobs...) is persisted in the database now, and job containers can
        # be reused between runs, so a leftover DB would hand this run the
        # previous run's objects.
        run: |
          rm -rf /tmp/horcrux-ci-data
          mkdir -p /tmp/horcrux-ci-data
          mkdir -p /tmp/horcrux-ci-cni/bin /tmp/horcrux-ci-cni/conf.d
          sudo mkdir -p /var/lib/horcrux/backups /var/lib/horcrux/storage/snapshot-test
          sudo chown -R "$(id -u):$(id -g)" /var/lib/horcrux
          HORCRUX_HOST=127.0.0.1 \
          HORCRUX_PORT=8006 \
          HORCRUX_DATA_DIR=/tmp/horcrux-ci-data \
          HORCRUX_DATABASE_URL="sqlite:///tmp/horcrux-ci-data/horcrux.db" \
          HORCRUX_CNI_BIN_DIR=/tmp/horcrux-ci-cni/bin \
          HORCRUX_CNI_CONF_DIR=/tmp/horcrux-ci-cni/conf.d \
          HORCRUX_SSL_DIR=/tmp/horcrux-ci-data/ssl \
          ADMIN_PASSWORD=admin \
          RATE_LIMIT_MAX_REQUESTS=100000 \
          AUTH_RATE_LIMIT_MAX_REQUESTS=1000 \
          HORCRUX_BACKUP_SCHEDULER_TICK_SECS=5 \
          HORCRUX_PAGERDUTY_EVENTS_URL=http://127.0.0.1:18765/v2/enqueue \
          AUTH_RATE_LIMIT_MAX_REQUESTS=100000 \
          RUST_LOG=info \
          nohup ./target/debug/horcrux-api > /tmp/horcrux-api.log 2>&1 &
          echo $! > /tmp/horcrux-api.pid

          echo "Waiting for horcrux-api to become healthy..."
          for i in $(seq 1 60); do
            # HTTPS by default (self-issued certificate from the node's local CA)
            if curl -sfk https://127.0.0.1:8006/api/health > /dev/null 2>&1; then
              echo "horcrux-api is up"
              exit 0
            fi
            sleep 1
          done
          echo "horcrux-api did not become healthy in time" >&2
          cat /tmp/horcrux-api.log >&2
          exit 1

      - name: Verify Docker access (container tests use the real daemon)
        # Container create/list/reconcile, stack networking and the UI
        # contract test drive the runner host's real Docker daemon; fail
        # loudly here instead of letting them silently test nothing.
        run: |
          docker info --format 'docker {{.ServerVersion}} on {{.OperatingSystem}}'
          docker pull -q busybox:latest

      - name: Start k3s + local chart repo (Helm contract test)
        # The UI contract test drives the Kubernetes > Helm pages' routes
        # against a real cluster: a throwaway k3s sibling container plus a
        # local chart repository (see the script). Installs helm for the
        # API server, which runs the helm CLI.
        run: bash horcrux-api/tests/k8s_helm_setup.sh

      - name: Run tests
        env:
          HORCRUX_TEST_REQUIRE_DOCKER: "1"
          HORCRUX_TEST_REQUIRE_K8S: "1"
          # The server was started with the same URL; the contract test
          # receives the PagerDuty Events v2 call there.
          HORCRUX_PAGERDUTY_EVENTS_URL: http://127.0.0.1:18765/v2/enqueue
        run: cargo test --all-features --workspace

      - name: Auth realms + ACME (OpenLDAP, Dex, PAM, Pebble)
        # Real servers in sibling containers on a private network: LDAP
        # search-then-bind login, OpenID Connect login through Dex, a PAM
        # host account, and an ACME certificate from Pebble validated over
        # HTTP-01 and then served by the live listener.
        run: |
          cargo test --all-features -p horcrux-api --test auth_realms_e2e --no-run --message-format=json > /tmp/realms-build.json
          TESTBIN=$(python3 -c 'import json,sys
          for l in open("/tmp/realms-build.json"):
              try: m=json.loads(l)
              except Exception: continue
              if m.get("reason")=="compiler-artifact" and m.get("executable") and m["target"]["name"]=="auth_realms_e2e": print(m["executable"])')
          test -x "$TESTBIN"
          bash horcrux-api/tests/auth_realms_e2e.sh target/debug/horcrux-api "$TESTBIN"

      - name: Firewall apply (real nftables)
        # The Test container is unprivileged; this runs the built API in a
        # throwaway NET_ADMIN sibling container and checks an applied rule
        # really lands in the kernel's nftables ruleset.
        run: bash horcrux-api/tests/firewall_nft_e2e.sh target/debug/horcrux-api

      - name: LXC containers (real nested LXC, Proxmox pct parity)
        # The Test container can't run LXC, so lxc_e2e.sh runs the built API
        # in a privileged sibling container with LXC installed, a VLAN-aware
        # bridge, a VLAN gateway and dnsmasq, and drives templates, create
        # (unprivileged/idmap, disk size, VLAN+static and DHCP NICs, bind
        # and volume mounts, nesting/keyctl/fuse), cgroup limits, pct set,
        # reboot, online resize, snapshots/rollback, shutdown, clone, the PTY
        # terminal and console-log WebSockets through the HTTP API, checking
        # each effect inside the real container. It then runs the UI
        # contract test's LXC part against that server.
        run: |
          contract=$(cargo test --all-features --workspace --no-run --message-format=json 2>/dev/null \
            | python3 -c 'import json,sys
          for l in sys.stdin:
              m = json.loads(l)
              if m.get("reason") == "compiler-artifact" and m.get("executable") and "/api_contract-" in m["executable"]:
                  print(m["executable"])' | tail -1)
          echo "UI contract test binary: ${contract:-<none>}"
          test -n "$contract"
          bash horcrux-api/tests/lxc_e2e.sh test target/debug/horcrux-api "$contract"

      - name: Incus containers (real nested Incus, in-browser consoles)
        # incus_e2e.sh runs the built API next to a real Incus daemon in a
        # privileged sibling container: an Incus container is created from
        # the form's image field, then its Terminal (exec PTY), Console
        # (type=console: log in on /dev/console and run a command) and
        # console-log WebSockets are driven through the HTTP API, and no
        # reply may tell the user to use a CLI console. Then the UI contract
        # test's console-ticket part runs against that server.
        run: |
          contract=$(cargo test --all-features --workspace --no-run --message-format=json 2>/dev/null \
            | python3 -c 'import json,sys
          for l in sys.stdin:
              m = json.loads(l)
              if m.get("reason") == "compiler-artifact" and m.get("executable") and "/api_contract-" in m["executable"]:
                  print(m["executable"])' | tail -1)
          echo "UI contract test binary: ${contract:-<none>}"
          test -n "$contract"
          bash horcrux-api/tests/incus_e2e.sh ct target/debug/horcrux-api "$contract"

      - name: Run tests (no default features)
        # Unit tests of the minimal build. The integration/contract tests
        # need the server, which is the --all-features build started above;
        # they already ran once in "Run tests" (running them a second time
        # against the same server only collided with their own leftovers).
        run: cargo test --no-default-features -p horcrux-api --lib --bins

      - name: Dump horcrux-api server log
        if: always()
        run: cat /tmp/horcrux-api.log || true

      - name: Remove k3s + chart repo
        if: always()
        run: bash horcrux-api/tests/k8s_helm_setup.sh --cleanup

      - name: Stop horcrux-api server
        if: always()
        run: |
          if [ -f /tmp/horcrux-api.pid ]; then
            kill "$(cat /tmp/horcrux-api.pid)" 2>/dev/null || true
          fi

  build:
    name: Build
    runs-on: linux-cross-x86_64
    # Pin to a multi-arch tag (not a single-platform sha256 digest) so
    # this job succeeds regardless of which x86_64-labeled runner picks
    # it up. Confirmed 2026-10-04: a second runner registered under the
    # x86_64 label (id 74716d47, version:dev) explicitly requests
    # platform=linux/arm64 for its job containers, but the runner-default
    # image is pinned by sha256 digest to a single-platform (amd64-only)
    # manifest, so "docker create" fails with "image ... does not provide
    # the specified platform (linux/arm64)" every time that runner wins
    # the race against the working beauxbatons runner (~every other run).
    # act-latest is a real multi-arch manifest list, so either runner can
    # pull the variant matching whatever platform it actually requests.
    container: catthehacker/ubuntu:act-latest
    needs: test
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            features: "full"
          - target: x86_64-unknown-linux-gnu
            features: "default"
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: https://github.com/dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential libvirt-dev libpam0g-dev

      - name: Ensure Node.js is present (self-heal)
        # catthehacker/ubuntu:act-latest job containers on the beauxbatons
        # runner are reused across runs rather than recreated per-job, and
        # node has been observed vanishing mid-job (after an apt-get
        # install of unrelated packages) between 2026-10-04 and
        # 2026-10-05, breaking every JS action (actions/cache,
        # actions/checkout's post step) for the rest of the job. Root
        # cause is the runner's container lifecycle (outside this repo);
        # self-heal cheaply here rather than fail the whole job.
        run: |
          if ! command -v node >/dev/null 2>&1; then
            echo "::warning::node missing from job container PATH - reinstalling"
            sudo apt-get update -qq
            sudo apt-get install -y nodejs
          fi
          node --version

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.target }}-

      - name: Build (features=${{ matrix.features }})
        # Deliberately NOT passing --target here even though the matrix
        # names a target triple (kept for cache-key/toolchain-install
        # purposes). An explicit --target makes cc-rs (via ring et al.)
        # treat the build as a cross-compile and pass arch-specific flags
        # like "-m64" to whatever "gcc" happens to be on PATH -- fine on
        # a genuine x86_64 runner, but this "x86_64"-labeled job can
        # actually land in an arm64-native container (beauxbatons is real
        # Apple Silicon; see the Gentoo Docker Build job's own comments on
        # this), where the installed gcc is arm64-native and rejects
        # "-m64" outright (confirmed failing in CI run 2497: "gcc: error:
        # unrecognized command-line option '-m64'"). Every other job in
        # this workflow (Check/Test/Build Web UI) already builds natively
        # without --target and passes; do the same here instead of
        # fighting cc-rs's cross-compile flag selection.
        run: |
          if [ "${{ matrix.features }}" = "full" ]; then
            cargo build --release --all-features
          else
            cargo build --release
          fi

  build-ui:
    name: Build Web UI
    runs-on: linux-cross-x86_64
    # Pin to a multi-arch tag (not a single-platform sha256 digest) so
    # this job succeeds regardless of which x86_64-labeled runner picks
    # it up. Confirmed 2026-10-04: a second runner registered under the
    # x86_64 label (id 74716d47, version:dev) explicitly requests
    # platform=linux/arm64 for its job containers, but the runner-default
    # image is pinned by sha256 digest to a single-platform (amd64-only)
    # manifest, so "docker create" fails with "image ... does not provide
    # the specified platform (linux/arm64)" every time that runner wins
    # the race against the working beauxbatons runner (~every other run).
    # act-latest is a real multi-arch manifest list, so either runner can
    # pull the variant matching whatever platform it actually requests.
    container: catthehacker/ubuntu:act-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: https://github.com/dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential libvirt-dev libpam0g-dev

      - name: Install trunk
        # `cargo install trunk` from source hits a real dependency conflict:
        # lightningcss pulls in two incompatible cssparser versions (0.33 vs
        # 0.37), failing to compile (confirmed 2026-09-25). Install the
        # prebuilt binary release instead - avoids building lightningcss
        # from source entirely, and is faster too.
        #
        # This job is labeled `runs-on: linux-cross-x86_64`, but the beauxbatons runner
        # (the designated non-AWS fallback, see standing CI notes) is actual
        # Apple Silicon hardware and does not always honor an amd64 container
        # platform for this job -- confirmed 2026-10-02 via `rustc`'s own
        # "default host tuple is aarch64-unknown-linux-gnu" in this job's log.
        # A hardcoded x86_64 trunk binary then fails under Rosetta with
        # "failed to open elf at /lib64/ld-linux-x86-64.so.2". Detect the
        # actual container arch via `uname -m` and fetch the matching trunk
        # release so this works whether the job lands on a genuine x86_64
        # container or an arm64 one.
        run: |
          case "$(uname -m)" in
            x86_64) TRUNK_ARCH=x86_64-unknown-linux-gnu ;;
            aarch64|arm64) TRUNK_ARCH=aarch64-unknown-linux-gnu ;;
            *) echo "Unsupported arch for trunk install: $(uname -m)" >&2; exit 1 ;;
          esac
          curl -L "https://github.com/trunk-rs/trunk/releases/latest/download/trunk-${TRUNK_ARCH}.tar.gz" | tar xzf -
          sudo mv trunk /usr/local/bin/trunk
          trunk --version

      - name: Ensure Node.js is present (self-heal)
        # catthehacker/ubuntu:act-latest job containers on the beauxbatons
        # runner are reused across runs rather than recreated per-job, and
        # node has been observed vanishing mid-job (after an apt-get
        # install of unrelated packages) between 2026-10-04 and
        # 2026-10-05, breaking every JS action (actions/cache,
        # actions/checkout's post step) for the rest of the job. Root
        # cause is the runner's container lifecycle (outside this repo);
        # self-heal cheaply here rather than fail the whole job.
        run: |
          if ! command -v node >/dev/null 2>&1; then
            echo "::warning::node missing from job container PATH - reinstalling"
            sudo apt-get update -qq
            sudo apt-get install -y nodejs
          fi
          node --version

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-wasm-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-wasm-

      - name: Build UI
        working-directory: horcrux-api/horcrux-ui
        run: trunk build --release

  security-audit:
    name: Security Audit
    runs-on: linux-cross-x86_64
    # Pin to a multi-arch tag (not a single-platform sha256 digest) so
    # this job succeeds regardless of which x86_64-labeled runner picks
    # it up. Confirmed 2026-10-04: a second runner registered under the
    # x86_64 label (id 74716d47, version:dev) explicitly requests
    # platform=linux/arm64 for its job containers, but the runner-default
    # image is pinned by sha256 digest to a single-platform (amd64-only)
    # manifest, so "docker create" fails with "image ... does not provide
    # the specified platform (linux/arm64)" every time that runner wins
    # the race against the working beauxbatons runner (~every other run).
    # act-latest is a real multi-arch manifest list, so either runner can
    # pull the variant matching whatever platform it actually requests.
    container: catthehacker/ubuntu:act-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: https://github.com/dtolnay/rust-toolchain@stable

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential libvirt-dev libpam0g-dev

      - name: Install cargo-audit
        run: cargo install cargo-audit

      - name: Run security audit
        # RUSTSEC-2023-0071 (rsa crate, Marvin Attack timing side-channel):
        # no fixed version exists upstream as of 2026-09-25. Re-evaluate and
        # drop this --ignore once RustCrypto/RSA ships a patched release.
        #
        # RUSTSEC-2024-0449 (unsafe-libyaml, unmaintained -- repo archived,
        # advisory assigned 2026-10-12): unsafe-libyaml is a transitive dep
        # of the (already-deprecated) serde_yaml crate we still depend on.
        # No vulnerability, just an unmaintained-crate warning; serde_yaml
        # itself needs to be replaced (e.g. with serde_yaml_ng or similar)
        # as a separate migration. Re-evaluate and drop this --ignore once
        # that migration lands.
        run: cargo audit --ignore RUSTSEC-2023-0071 --ignore RUSTSEC-2024-0449

  gentoo-docker-build:
    name: Gentoo Docker Build
    runs-on: linux-cross-x86_64
    # Pin to a multi-arch tag (not a single-platform sha256 digest) so
    # this job succeeds regardless of which x86_64-labeled runner picks
    # it up. Confirmed 2026-10-04: a second runner registered under the
    # x86_64 label (id 74716d47, version:dev) explicitly requests
    # platform=linux/arm64 for its job containers, but the runner-default
    # image is pinned by sha256 digest to a single-platform (amd64-only)
    # manifest, so "docker create" fails with "image ... does not provide
    # the specified platform (linux/arm64)" every time that runner wins
    # the race against the working beauxbatons runner (~every other run).
    # act-latest is a real multi-arch manifest list, so either runner can
    # pull the variant matching whatever platform it actually requests.
    container: catthehacker/ubuntu:act-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      - name: Build Gentoo/Portage image
        # The Dockerfile's default HORCRUX_USE ("qemu cli monitoring systemd
        # webui") is the correct bare-metal-recommended feature set, but for
        # this CI job it silently pulls in app-emulation/qemu with ALL FOUR
        # softmmu/user cross-arch targets (x86_64/aarch64/riscv64/arm) plus
        # app-emulation/libvirt (spice-gtk, GTK, etc.) which in turn requires
        # building llvm-core/llvm from source in BOTH the 21 and 22 slots
        # simultaneously (two full from-source LLVM builds). Confirmed via
        # the actual CI log: still on package 161/181 (llvm-core/llvm-22.1.8,
        # a from-source LLVM build) when the runner killed the job for
        # exceeding its 3-hour maximum run time -- a real resource/timeout
        # failure, not a build error. This job only smoke-tests `--version`/
        # `--help`, so it doesn't need the full qemu/libvirt virtualization
        # stack at all.
        #
        # First attempt at a fix (HORCRUX_USE="cli systemd docker", no
        # explicit "-qemu -monitoring -webui") did NOT actually disable
        # qemu/libvirt: horcrux-0.1.0.ebuild's IUSE declares "+monitoring
        # +qemu +webui" (default-on). Writing package.use entries only ADDS
        # the flags you list -- it does not clear IUSE defaults for flags
        # you don't mention -- so qemu/monitoring/webui stayed enabled and
        # the build still pulled in the full libvirt/qemu chain, this time
        # hitting a real masked-package dependency wall (>=sys-block/parted
        # -3.7[device-mapper] / dnsmasq[script] / gnutls[pkcs11,tools] all
        # required by libvirt but unsatisfiable in this Gentoo snapshot) --
        # confirmed via actions/jobs/9563/logs. Must explicitly negate the
        # default-on flags ("-qemu -monitoring -webui") for the override to
        # actually take effect, in addition to enabling the lightweight
        # docker container-runtime backend (still satisfies the ebuild's
        # REQUIRED_USE of "at least one virt backend or container runtime").
        # Bare-metal installs following gentoo/package.use/horcrux directly
        # are unaffected and still get the full qemu+libvirt virtualization
        # stack -- this override only applies to the CI-only build-arg.
        #
        # TARGETARCH must be passed explicitly here, not left to BuildKit's
        # auto-detection: that auto-population only kicks in for
        # `docker buildx build --platform=...` multi-arch builds, not a
        # plain `docker build` (even with the BuildKit backend). Without
        # an explicit --build-arg, the Dockerfile's `ARG TARGETARCH=amd64`
        # default wins regardless of host arch, so an arm64 runner (e.g.
        # beauxbatons) still pulls gentoo/stage3:amd64-systemd and falls
        # straight back into the same qemu-user cross-arch emulation that
        # SIGABRTs Gentoo sandbox's personality() probe mid-build
        # ("unknown x86_64 (CS) personality", confirmed via CI run
        # 2406/job 11524 even after adding the ARG).
        #
        # `uname -m` is NOT a reliable way to detect the right stage3
        # variant here: the beauxbatons runner is literally named/labeled
        # "beauxbatons-x86-emulated" in the task log -- its *job container*
        # itself runs under x86_64 emulation (to satisfy the `runs-on:
        # x86_64` label on real Apple Silicon hardware), so `uname -m`
        # inside the job shell reports x86_64 even though the real Docker
        # daemon backing it is native arm64 (confirmed via CI run
        # 2407/job 11531: still "InvalidBaseImagePlatform ... expected
        # linux/arm64" and the identical sandbox SIGABRT, because the
        # emulated-x86_64 uname fooled the case statement into picking
        # amd64 again). Ask the Docker daemon itself what it natively is
        # instead -- that reflects the real host, not the emulated shell
        # wrapping this job.
        run: |
          daemon_arch="$(docker info --format '{{.Architecture}}' 2>/dev/null || true)"
          case "$daemon_arch" in
            x86_64|amd64) target_arch=amd64 ;;
            aarch64|arm64) target_arch=arm64 ;;
            *)
              echo "Unrecognized Docker daemon architecture: '$daemon_arch' -- falling back to uname -m" >&2
              case "$(uname -m)" in
                x86_64) target_arch=amd64 ;;
                aarch64|arm64) target_arch=arm64 ;;
                *) echo "Unsupported arch: $(uname -m)" >&2; exit 1 ;;
              esac
              ;;
          esac
          echo "Docker daemon architecture: $daemon_arch -> building stage3:${target_arch}-systemd"
          docker build \
            --build-arg TARGETARCH="$target_arch" \
            --build-arg HORCRUX_USE="cli systemd docker -qemu -monitoring -webui" \
            -t horcrux/api:${{ github.sha }} .

      - name: Smoke-test the built image
        # horcrux-api has no CLI arg parsing at all (main() ignores argv
        # entirely and always goes straight into full server startup +
        # DB connect/migrate) -- there is no --version/--help path to
        # invoke, so `docker run ... --version` doesn't print a version
        # and exit like a normal CLI tool; the ENTRYPOINT-based image
        # instead tries to launch the *real* server with "--version"
        # silently ignored as an arg, which then hangs forever waiting
        # on a real DB/port bind in this bare CI container until the job
        # times out. Confirmed via actions/jobs/9637/logs: the previous
        # CMD-only (no ENTRYPOINT) Dockerfile failed even earlier/worse --
        # `docker run image --version` replaces CMD outright, so the
        # container tried to exec a file literally named "--version" and
        # failed immediately with "executable file not found in $PATH".
        # Don't run the server at all for this smoke test -- just prove
        # the binary landed in the image, is executable, and is a real
        # ELF (not e.g. a 0-byte COPY failure or a text/shell stub).
        run: |
          docker create --name horcrux-smoke horcrux/api:${{ github.sha }}
          docker cp horcrux-smoke:/usr/local/bin/horcrux-api /tmp/horcrux-api-smoke
          docker rm -f horcrux-smoke
          test -s /tmp/horcrux-api-smoke
          file /tmp/horcrux-api-smoke | grep -qi 'ELF'
          test -x /tmp/horcrux-api-smoke
          echo "horcrux-api binary present, non-empty, executable ELF -- smoke test OK"

  use-features:
    name: USE-flag feature builds
    runs-on: linux-cross-x86_64
    container: catthehacker/ubuntu:act-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: https://github.com/dtolnay/rust-toolchain@stable

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential libvirt-dev libpam0g-dev

      - name: Ensure Node.js is present (self-heal)
        run: |
          if ! command -v node >/dev/null 2>&1; then
            echo "::warning::node missing from job container PATH - reinstalling"
            sudo apt-get update -qq
            sudo apt-get install -y nodejs
          fi
          node --version

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-features-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-features-

      - name: Every ebuild USE flag maps to a Cargo feature
        # src_configure() turns USE flags into --features; a USE flag whose
        # feature doesn't exist breaks `emerge`, and a Cargo feature with
        # no USE flag can never be selected by a Gentoo user.
        run: |
          eb=gentoo/app-emulation/horcrux/horcrux-9999.ebuild
          mapped=$(grep -oE 'usex [a-z0-9-]+ "[a-z0-9-]+"' "$eb" | awk '{print $3}' | tr -d '"' | sort -u)
          declared=$(sed -n '/^\[features\]/,/^\[/p' horcrux-api/Cargo.toml | grep -oE '^[a-z0-9-]+' | sort -u)
          missing=$(comm -23 <(echo "$mapped") <(echo "$declared"))
          [ -z "$missing" ] || { echo "USE flags mapped to undefined Cargo features: $missing"; exit 1; }
          # Bundles/defaults/internal features are not USE flags.
          unmapped=$(comm -13 <(echo "$mapped") <(echo "$declared") | grep -vE '^(default|nas-full|nas-basic|nas-apple|nas-enterprise|nas-auth)$' || true)
          [ -z "$unmapped" ] || { echo "Cargo features with no USE flag in $eb: $unmapped"; exit 1; }
          # src/features.rs reports compiled features to the UI (GET
          # /api/features); a Cargo feature missing from its table would be
          # invisible to the UI's hiding logic.
          table=$(sed -n '/^feature_table!(/,/^);/p' horcrux-api/src/features.rs | grep -oE '"[a-z0-9-]+"' | tr -d '"' | sort -u)
          notable=$(comm -13 <(echo "$table") <(echo "$declared") | grep -vE '^(default|nas-full|nas-basic|nas-apple|nas-enterprise)$' || true)
          [ -z "$notable" ] || { echo "Cargo features missing from src/features.rs feature_table!: $notable"; exit 1; }
          for f in gentoo/app-emulation/horcrux/horcrux-*.ebuild deploy/gentoo/horcrux-*.ebuild; do
            diff <(grep -oE 'usex [a-z0-9-]+ "[a-z0-9-]+"' "$eb") <(grep -oE 'usex [a-z0-9-]+ "[a-z0-9-]+"' "$f") \
              || { echo "$f maps USE flags differently from $eb"; exit 1; }
          done
          echo "USE flags <-> Cargo features consistent:"; echo $mapped

      - name: Build each USE-flag feature on its own
        # The Test job builds --all-features, which hides code that only
        # compiles when some *other* feature is also on. A Gentoo user can
        # pick any single flag, so each cfg-gated feature must build alone
        # (no defaults). Features with no cfg gate compile identical code,
        # so they are checked together in one build.
        run: |
          gated=$(grep -rhoE 'feature *= *"[a-z0-9-]+"' horcrux-api/src horcrux-api/tests | grep -oE '"[a-z0-9-]+"' | tr -d '"' | sort -u)
          all=$(sed -n '/^\[features\]/,/^\[/p' horcrux-api/Cargo.toml | grep -oE '^[a-z0-9-]+' | grep -v '^default$' | sort -u)
          plain=$(comm -13 <(echo "$gated") <(echo "$all") | grep -vE '^nas-(full|basic|apple|enterprise)$' | tr '\n' ',' | sed 's/,$//')
          failed=""
          for f in $gated "$plain"; do
            echo "::group::cargo check --no-default-features --features $f"
            if ! cargo check -p horcrux-api --no-default-features --features "$f" --all-targets; then
              failed="$failed $f"
            fi
            echo "::endgroup::"
          done
          [ -z "$failed" ] || { echo "Features that fail to build alone:$failed"; exit 1; }
          echo "All $(echo $gated | wc -w) gated features + [$plain] build on their own"

  ui-e2e:
    name: UI E2E (browser)
    runs-on: linux-cross-x86_64
    container: catthehacker/ubuntu:act-latest
    needs: check
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: https://github.com/dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install build tools
        # qemu-system-x86 (+ SPICE modules on Ubuntu 24.04+): the console
        # checks start a real VM and connect noVNC / fetch its SPICE .vv.
        run: |
          sudo apt-get update
          spice_mods=""
          if apt-cache show qemu-system-modules-spice >/dev/null 2>&1; then
            spice_mods="qemu-system-modules-spice"
          fi
          sudo apt-get install -y build-essential libvirt-dev python3-venv libpam0g-dev libnss3-tools qemu-utils zstd qemu-system-x86 $spice_mods

      - name: Install trunk
        # Same prebuilt-binary install as the Build Web UI job.
        run: |
          case "$(uname -m)" in
            x86_64) TRUNK_ARCH=x86_64-unknown-linux-gnu ;;
            aarch64|arm64) TRUNK_ARCH=aarch64-unknown-linux-gnu ;;
            *) echo "Unsupported arch: $(uname -m)" >&2; exit 1 ;;
          esac
          curl -L "https://github.com/trunk-rs/trunk/releases/latest/download/trunk-${TRUNK_ARCH}.tar.gz" | tar xzf -
          sudo mv trunk /usr/local/bin/trunk

      - name: Ensure Node.js is present (self-heal)
        run: |
          if ! command -v node >/dev/null 2>&1; then
            echo "::warning::node missing from job container PATH - reinstalling"
            sudo apt-get update -qq
            sudo apt-get install -y nodejs
          fi
          node --version

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-e2e-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-e2e-

      - name: Build web UI and API
        run: |
          (cd horcrux-api/horcrux-ui && trunk build)
          cargo build --all-features -p horcrux-api --bin horcrux-api

      - name: Install Playwright + Chromium
        run: |
          python3 -m venv /tmp/pw
          /tmp/pw/bin/pip install -q playwright
          sudo /tmp/pw/bin/playwright install-deps chromium
          /tmp/pw/bin/playwright install chromium

      - name: Start horcrux-api serving the built UI
        run: |
          docker info --format 'docker {{.ServerVersion}}'
          mkdir -p /tmp/e2e-data /tmp/e2e-cni/bin /tmp/e2e-cni/conf.d
          HORCRUX_HOST=127.0.0.1 HORCRUX_PORT=8006 \
          HORCRUX_DATA_DIR=/tmp/e2e-data \
          HORCRUX_CNI_BIN_DIR=/tmp/e2e-cni/bin HORCRUX_CNI_CONF_DIR=/tmp/e2e-cni/conf.d \
          HORCRUX_DATABASE_URL="sqlite:///tmp/e2e-data/horcrux.db" \
          HORCRUX_UI_DIR="$PWD/horcrux-api/horcrux-ui/dist" \
          HORCRUX_SSL_DIR=/tmp/e2e-data/ssl \
          ADMIN_PASSWORD=admin RATE_LIMIT_MAX_REQUESTS=100000 AUTH_RATE_LIMIT_MAX_REQUESTS=100000 RUST_LOG=info \
          nohup ./target/debug/horcrux-api > /tmp/horcrux-e2e.log 2>&1 &
          echo $! > /tmp/horcrux-e2e.pid
          for i in $(seq 1 60); do
            if curl -sfk https://127.0.0.1:8006/api/health >/dev/null; then
              # Trust the node's local CA (downloadable without login) in
              # Chromium's NSS store and for Python: real certificate
              # validation, and a secure context for WebAuthn.
              curl -sfk https://127.0.0.1:8006/api/tls/ca.pem -o /tmp/horcrux-ca.pem
              mkdir -p "$HOME/.pki/nssdb"
              certutil -d "sql:$HOME/.pki/nssdb" -N --empty-password 2>/dev/null || true
              certutil -d "sql:$HOME/.pki/nssdb" -A -t "C,," -n horcrux-local-ca -i /tmp/horcrux-ca.pem
              curl -sf --cacert /tmp/horcrux-ca.pem https://localhost:8006/api/health
              exit 0
            fi
            sleep 1
          done
          cat /tmp/horcrux-e2e.log; exit 1

      - name: Run browser E2E
        env:
          BASE_URL: https://localhost:8006
          HORCRUX_CA_FILE: /tmp/horcrux-ca.pem
        run: /tmp/pw/bin/python horcrux-api/horcrux-ui/e2e/ui_e2e.py

      - name: UI offers every USE-flag feature of an all-features build
        env:
          BASE_URL: https://localhost:8006
          HORCRUX_CA_FILE: /tmp/horcrux-ca.pem
        run: MODE=full /tmp/pw/bin/python horcrux-api/horcrux-ui/e2e/ui_features_e2e.py

      - name: LXC browser E2E (real nested LXC behind the UI)
        # The API + this build's UI run in a privileged LXC sibling on this
        # job's docker network (lxc_e2e.sh serve writes its HTTPS URL and CA);
        # the browser then downloads a template, creates an LXC container
        # from the form, manages it (settings, snapshot, shutdown, delete)
        # and checks the results on the page.
        if: ${{ !cancelled() }}
        run: |
          rc=0
          bash horcrux-api/tests/lxc_e2e.sh serve target/debug/horcrux-api horcrux-api/horcrux-ui/dist 8007 || rc=$?
          if [ $rc -eq 0 ]; then
            BASE_URL=$(cat /tmp/horcrux-lxc-e2e.url) HORCRUX_CA_FILE=/tmp/horcrux-lxc-e2e-ca.pem \
              /tmp/pw/bin/python horcrux-api/horcrux-ui/e2e/lxc_ui_e2e.py || rc=$?
          fi
          bash horcrux-api/tests/lxc_e2e.sh stop
          exit $rc

      - name: Incus browser E2E (container console + terminal)
        # The API + this build's UI run next to a real Incus daemon
        # (incus_e2e.sh serve); the browser creates an Incus container from
        # the form, opens Console from the list (logs in on /dev/console and
        # runs a command) and the Terminal (exec PTY).
        if: ${{ !cancelled() }}
        run: |
          rc=0
          bash horcrux-api/tests/incus_e2e.sh serve target/debug/horcrux-api horcrux-api/horcrux-ui/dist 8008 || rc=$?
          if [ $rc -eq 0 ]; then
            BASE_URL=$(cat /tmp/horcrux-incus-e2e.url) HORCRUX_CA_FILE=/tmp/horcrux-incus-e2e-ca.pem MODE=ct \
              /tmp/pw/bin/python horcrux-api/horcrux-ui/e2e/incus_ui_e2e.py || rc=$?
          fi
          bash horcrux-api/tests/incus_e2e.sh stop
          exit $rc

      - name: Dump horcrux-api log
        if: always()
        run: tail -200 /tmp/horcrux-e2e.log || true

      - name: Stop horcrux-api
        if: always()
        run: kill "$(cat /tmp/horcrux-e2e.pid)" 2>/dev/null || true

      - name: UI hides features a reduced USE set did not compile in
        # Independent of the steps above (own binary, own port), so it
        # still reports when an earlier E2E step failed.
        if: ${{ !cancelled() }}
        # Same UI bundle, server built with only the lxc feature (what
        # USE="lxc -docker -podman -qemu -backup -cluster -nas -kubernetes"
        # compiles): menus, pages and form options of everything else must
        # be hidden / marked "not compiled in" (horcrux-ui/src/features.rs).
        run: |
          cargo build -p horcrux-api --bin horcrux-api --no-default-features --features lxc
          cp target/debug/horcrux-api /tmp/horcrux-api-reduced
          rm -rf /tmp/e2e-reduced && mkdir -p /tmp/e2e-reduced
          HORCRUX_HOST=127.0.0.1 HORCRUX_PORT=8017 HORCRUX_DATA_DIR=/tmp/e2e-reduced \
          HORCRUX_DATABASE_URL="sqlite:///tmp/e2e-reduced/horcrux.db" \
          HORCRUX_UI_DIR="$PWD/horcrux-api/horcrux-ui/dist" HORCRUX_SSL_DIR=/tmp/e2e-reduced/ssl \
          ADMIN_PASSWORD=admin RATE_LIMIT_MAX_REQUESTS=100000 AUTH_RATE_LIMIT_MAX_REQUESTS=1000 RUST_LOG=info \
          nohup /tmp/horcrux-api-reduced > /tmp/horcrux-reduced.log 2>&1 &
          echo $! > /tmp/horcrux-reduced.pid
          for i in $(seq 1 60); do
            curl -sfk https://127.0.0.1:8017/api/health >/dev/null && break
            sleep 1
          done
          curl -sfk https://127.0.0.1:8017/api/features
          echo
          set +e
          BASE_URL=https://127.0.0.1:8017 MODE=reduced /tmp/pw/bin/python horcrux-api/horcrux-ui/e2e/ui_features_e2e.py
          rc=$?
          kill "$(cat /tmp/horcrux-reduced.pid)" 2>/dev/null
          [ $rc -eq 0 ] || { tail -100 /tmp/horcrux-reduced.log; exit $rc; }

  gentoo-use-matrix:
    name: Gentoo USE-flag matrix (ebuild install)
    runs-on: linux-cross-x86_64
    container: catthehacker/ubuntu:act-latest
    # Runs after the main Gentoo build so the shared builder-stage layers
    # (stage3, emerge-webrsync, rust-bin) are already in the daemon's cache.
    needs: gentoo-docker-build
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Ebuild phases for contrasting USE sets
        # See gentoo/ci/use-matrix.sh: runs `ebuild horcrux-9999.ebuild
        # install` with everything-on (OpenRC, webui, NAS, kubernetes), a
        # minimal systemd set (lxc only) and a podman+cluster set, checks the
        # installed files, and starts the installed horcrux-api to confirm
        # USE-disabled features' routes are really absent (404), enabled
        # ones are served, GET /api/features reports exactly the USE set, and
        # a docker container / qemu VM is refused when not compiled in.
        run: |
          daemon_arch="$(docker info --format '{{.Architecture}}' 2>/dev/null || true)"
          case "$daemon_arch" in
            x86_64|amd64) target_arch=amd64 ;;
            aarch64|arm64) target_arch=arm64 ;;
            *) echo "Unrecognized Docker daemon architecture: '$daemon_arch'" >&2; exit 1 ;;
          esac
          docker build \
            --target use-matrix \
            --build-arg TARGETARCH="$target_arch" \
            --build-arg HORCRUX_USE="cli systemd docker -qemu -monitoring -webui" \
            -t horcrux/use-matrix:${{ github.sha }} .
          docker rmi horcrux/use-matrix:${{ github.sha }} || true

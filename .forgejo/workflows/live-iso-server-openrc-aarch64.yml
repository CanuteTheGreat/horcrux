# Daily + release ISO for horcrux (Gentoo live/installer; x86_64 UEFI+BIOS hybrid, aarch64 UEFI).
#
#  * schedule : build from main, QEMU boot + unattended install + reboot + web probe
#               (UEFI+USB and BIOS+CD), publish ONLY if everything passed, to the rolling
#               PRE-release `daily` (stable URL, assets replaced in place).
#  * v* tag   : same build + tests from the tag, attached to that release as a stable ISO
#               (criteria: docs/ISO-INSTALL.md "Stable ISO criteria").
#  * A build/test/publish failure FAILS the run (red run = e-mail to the owner; a green run means an image was built,
#    tested and published). The result is also written to the `daily-status-*` release marker and the job summary;
#    ~/.hermes iso-status-watch additionally alerts when a published daily asset is older than 36 h.
# One job per architecture, each BUILT NATIVELY and tested under QEMU on its own runner label:
#   x86_64  kvm-x86_64  (rw-man-01 colo, /dev/kvm, host docker)  -> horcrux-server-openrc-daily-x86_64.iso
#   aarch64 arm64       (rw-man-04/05 Graviton, host docker; no /dev/kvm there, so QEMU runs TCG, timeouts x3)  -> horcrux-server-openrc-daily-aarch64.iso
# Image names: <product>-<desktop-env | server>-<init>-<channel>-<arch>.iso (build/live-iso/common/image-name.sh; docs/ISO-INSTALL.md "Image names").
#   (riscv64 is not in the matrix: see docs/ISO-INSTALL.md "riscv64" - no native runner, no rust image)
# Each image publishes its own asset set and its own status marker (daily-status-<DE|server>-<init>-<arch>) so one failing
# arch never blocks the other. BuildKit cache mounts (binpkgs,
# distfiles, ccache, cargo target) persist on the host, so a cached daily takes minutes, not hours.
# SPLIT 2026-11-06 (queue work): one workflow per image so a 3-10 h build of one variant no longer serialises behind the others
# (the single `live-iso-<project>` group made every run wait for the previous run's SLOWEST job; no image published for 32 h).
# This file builds ONLY server-openrc-aarch64. Siblings: see the other live-iso-*.yml. Dispatch inputs: `mode` (daily|dry); `only` is gone.
# Concurrency: per variant + event + mode + ref. A newer dispatch of the same variant/mode/ref cancels the older one (superseded);
# the scheduled daily and v* tag runs are never cancelled by a dispatch (their group differs), tag groups are per tag.
name: Live ISO (server-openrc-aarch64)

on:
  schedule:
    - cron: '40 19 * * *'   # 11:40 PST; moved 2026-11-06 off the 00:00-03:00 PST pile-up (measured busiest), see ctg ci-wait-and-queue reference
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      mode:
        description: 'daily (publish to the rolling pre-release) or dry (build + test only)'
        required: false
        default: 'dry'

concurrency:
  group: "live-iso-server-openrc-aarch64-${{ github.event_name }}-${{ github.event.inputs.mode }}-${{ github.ref }}"
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' }}

jobs:
  live-iso:
    name: Build + test + publish live ISO (server-openrc-aarch64)
    runs-on: nightly-arm64   # heavy on-demand lane: 8 h runner timeout (the TCG matrix takes 4+ h; the per-push arm64 runners cancel at 3 h)
    container: catthehacker/ubuntu:act-latest
    timeout-minutes: 480   # the headless server gate (encrypted-ZFS install + serial reboot + checks) is an extra QEMU run per arch; aarch64 runs it under TCG (~2 h)
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Build, test, publish
        env:
          FORGEJO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_RELEASE_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}   # public GitHub mirror release (second publish step)
          ARCH: aarch64
          JOBS: '4'
        run: |
          set -u
          case "${GITHUB_REF_TYPE:-}" in
            tag) mode=stable ;;
            *)   mode=daily ;;
          esac
          if [ "${GITHUB_EVENT_NAME}" = workflow_dispatch ] && [ "${{ github.event.inputs.mode }}" != daily ]; then
            # dry run: no token => nothing is published
            FORGEJO_TOKEN= bash build/live-iso/common/ci-run.sh "$mode"
          else
            bash build/live-iso/common/ci-run.sh "$mode"
          fi

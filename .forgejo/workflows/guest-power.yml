name: Guest save state + cluster drain (2 nodes, KVM)

# Save state on host shutdown / resume on boot for real QEMU VMs (RAM marker,
# process and uptime survive; free-space check; the unit's stop path then the
# boot path; crash fallback; stale state refused - guest_state_e2e.py) and a
# two-node cluster drain: maintenance live-migrates VMs away without a restart,
# the host shutdown drains first, the node returns and the cluster rebalances,
# and a target killed mid-move leaves exactly one running copy
# (drain_e2e.py). Real QEMU (KVM, TCG when the runner has no /dev/kvm) and
# CirrOS guests in sibling containers.
#
# Containers (LXC, Incus, Docker, Podman) need a kernel where CRIU works,
# which a container on the runner is not: they run in throwaway Debian VMs
# (own kernel, KVM) that have all four runtimes and CRIU installed
# (hx_vm.sh): save state / resume with a process that must survive
# (guest_state_ct_vm_e2e.py - never skipped, `criu check` must pass) and, in
# two clustered VMs, drain / rebalance moving containers between nodes live
# (CRIU; `incus move`), cold when the target has no CRIU, and with rollback
# when the target cannot take them (drain_ct_vm_e2e.py). Nightly (and on
# demand) the VM save/resume + drain e2e also run once under TCG.
# Runs on rw-man-01's kvm-x86_64 runner on every push that touches the code
# involved, nightly, and on demand.
on:
  push:
    branches: [main]
    paths:
      - 'horcrux-api/src/api/guest_state/**'
      - 'horcrux-api/src/api/drain.rs'
      - 'horcrux-api/src/api/vm_migration.rs'
      - 'horcrux-api/src/api/migration_peer.rs'
      - 'crates/horcrux-vm/src/vm/savestate.rs'
      - 'crates/horcrux-vm/src/vm/qemu.rs'
      - 'crates/horcrux-cluster/src/cluster/drain.rs'
      - 'crates/horcrux-container/src/container/savestate.rs'
      - 'crates/horcrux-container/src/container/transfer.rs'
      - 'crates/horcrux-container/src/container/lxc_config.rs'
      - 'horcrux-api/src/api/ct_move.rs'
      - 'deploy/systemd/horcrux-guests.service'
      - 'horcrux-api/tests/guest_state_e2e.*'
      - 'horcrux-api/tests/drain_e2e.*'
      - 'horcrux-api/tests/hx_node.py'
      - 'horcrux-api/tests/hx_vm*.sh'
      - 'horcrux-api/tests/guest_state_ct_vm_e2e.*'
      - 'horcrux-api/tests/drain_ct_vm_e2e.*'
      - '.forgejo/workflows/guest-power.yml'
  workflow_dispatch: {}
  schedule:
    - cron: '20 10 * * *'

concurrency:
  group: guest-power
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  guest-power:
    name: Save state (VMs, containers with CRIU) + two-node drain / rebalance
    runs-on: kvm-x86_64
    container: catthehacker/ubuntu:act-latest
    timeout-minutes: 180
    env:
      CARGO_BUILD_JOBS: "4"
      HX_RUN_TAG: ${{ github.run_id }}-${{ github.job }}-${{ github.run_attempt }}   # run-scoped sibling container/network/volume names: exact cleanup, no collision with other jobs
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: https://github.com/dtolnay/rust-toolchain@stable

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libvirt-dev libpam0g-dev
          ls -l /dev/kvm || echo "no /dev/kvm: guests run under TCG (slow)"

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-guest-power-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-guest-power-

      - name: Build API (all features)
        run: cargo build --all-features -p horcrux-api --bin horcrux-api

      - name: Save state / resume of QEMU VMs end to end
        run: bash horcrux-api/tests/guest_state_e2e.sh target/debug/horcrux-api

      - name: Two-node drain + rebalance end to end
        run: bash horcrux-api/tests/drain_e2e.sh target/debug/horcrux-api

      - name: Cache the Debian test-VM image (runtimes + CRIU installed)
        uses: actions/cache@v4
        with:
          path: ~/.cache/hx-vm
          key: hx-vm-trixie-${{ hashFiles('horcrux-api/tests/hx_vm_provision.sh') }}
          restore-keys: |
            hx-vm-trixie-

      - name: "Containers: save state / resume with real CRIU (LXC, Incus, Docker, Podman)"
        run: bash horcrux-api/tests/guest_state_ct_vm_e2e.sh target/debug/horcrux-api

      - name: "Containers: cross-node moves in a two-node drain / rebalance (live, cold, rollback)"
        run: bash horcrux-api/tests/drain_ct_vm_e2e.sh target/debug/horcrux-api

      - name: "VMs under TCG (no /dev/kvm): save / resume and drain"
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          HX_NO_KVM: "1"
        run: |
          bash horcrux-api/tests/guest_state_e2e.sh target/debug/horcrux-api
          bash horcrux-api/tests/drain_e2e.sh target/debug/horcrux-api

      - name: Remove leftover siblings
        if: always()
        run: |
          # exact: only THIS run's siblings (HX_RUN_TAG), never another job's
          pkill -f qemu-system-x86_64 || true
          docker ps -a --filter "name=horcrux-gs-e2e-$HX_RUN_TAG" --format '{{.Names}}' | xargs -r docker rm -fv
          docker ps -a --filter "name=hxdrain-$HX_RUN_TAG-" --format '{{.Names}}' | xargs -r docker rm -fv
          docker network ls --filter "name=hxdrain-$HX_RUN_TAG-" --format '{{.Name}}' | xargs -r docker network rm || true
          docker volume ls --filter "name=hxdrain-$HX_RUN_TAG-" --format '{{.Name}}' | xargs -r docker volume rm || true

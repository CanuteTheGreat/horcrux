name: Horcrux guest tools (Windows MSI, Linux agent, real Linux guest)

# Builds the Horcrux guest tools for both guest families and tests the
# Linux agent inside a real VM through the guest-tools virtio-serial port:
# - Windows: cross-compiled horcrux-guest-agent.exe (x86_64-pc-windows-gnu)
#   packed as an MSI with wixl (ci/build-guest-tools-msi.sh); the MSI tables
#   are checked with msiinfo.
# - Linux: static musl agent, deb/rpm/apk packages (nfpm, install-tested in
#   debian/fedora/alpine containers), the guest-tools CD image
#   (ci/build-guest-tools-iso.sh), then crates/horcrux-guest-tools/tests/
#   linux_guest_e2e.py boots Alpine with the tools CD and checks capture +
#   encode, keyboard/mouse/gamepad injection and the keystroke-to-frame
#   latency on the same host.
# - Same-host raw frames (Horcrux frame ring): crates/horcrux-viewer/tests/
#   shm_guest_e2e.py gives the guest the ivshmem frame ring, the Linux agent
#   writes raw frames into it, and horcrux-viewer's headless reader measures
#   frame-to-viewer and keystroke-to-frame times.
# - Viewer window on a real compositor (job viewer-window): a real horcrux-api
#   node and Alpine guest with the tools CD and the frame ring, headless sway
#   (pixman, no GPU) with the real horcrux-viewer window, grim screenshots
#   compared with the guest's own screen, and keys typed into the compositor
#   (virtual-keyboard protocol) that must run a command in the guest
#   (crates/horcrux-viewer/tests/viewer_window_e2e.sh).
# The Windows agent's own real-Windows checks are
# crates/horcrux-guest-tools/tests/win_harness.py (Windows eval VM).
on:
  push:
    paths:
      - 'crates/horcrux-guest-proto/**'
      - 'crates/horcrux-guest-tools/**'
      - 'crates/horcrux-viewer/**'
      - 'packaging/windows/**'
      - 'packaging/linux/**'
      - 'ci/build-guest-tools-*.sh'
      - 'ci/test-guest-tools-pkgs.sh'
      - '.forgejo/workflows/guest-tools.yml'
  workflow_dispatch: {}

concurrency:
  group: "replace:${{ github.workflow }}@${{ github.ref }}"
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: never
  CARGO_BUILD_JOBS: "3"

jobs:
  guest-tools:
    name: Build MSI + Linux agent, Linux guest e2e (KVM)
    runs-on: kvm-x86_64
    container: catthehacker/ubuntu:act-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: https://github.com/dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu,x86_64-unknown-linux-musl

      - name: Ubuntu mirror failover (build-cache hub)
        run: curl -fsS -m 5 http://10.1.10.103:8088/ci/apt-mirror.sh | sh || true
      - name: Install tools
        run: |
          for i in 1 2 3; do
            sudo apt-get update -qq || true
            apt-cache policy wixl | grep -q 'Candidate: [0-9]' && break
            sleep 15
          done
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            gcc-mingw-w64-x86-64 cmake msitools wixl xorriso qemu-system-x86 qemu-utils ffmpeg curl
          ls -l /dev/kvm

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-guest-tools-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-guest-tools-

      - name: Unit tests (protocol, agent, native viewer)
        run: cargo test -p horcrux-guest-proto -p horcrux-guest-tools -p horcrux-viewer

      - name: Windows agent + MSI
        run: |
          bash ci/build-guest-tools-msi.sh
          msi=$(ls dist/horcrux-guest-tools-*-x64.msi)
          msiinfo export "$msi" ServiceInstall | grep -q HorcruxGuestTools
          msiinfo export "$msi" File | grep -q horcrux-guest-agent.exe
          echo "ok - $msi"

      - name: Linux agent (static) + guest tools CD
        run: |
          cargo build -p horcrux-guest-tools --release --target x86_64-unknown-linux-musl
          bash ci/build-guest-tools-pkgs.sh
          bash ci/build-guest-tools-iso.sh

      - name: Linux packages install test (debian, fedora, alpine in real containers)
        run: |
          # job containers see the runner's Docker daemon; the test uses
          # docker create + cp + start -a (no bind mounts).
          bash ci/test-guest-tools-pkgs.sh

      - name: Linux guest e2e (Alpine, virtio-serial guest-tools port)
        run: |
          AMIRROR=https://dl-cdn.alpinelinux.org/alpine/latest-stable/releases/x86_64
          meta=$(curl -fsSL --retry 3 "$AMIRROR/latest-releases.yaml")
          afile=$(printf '%s\n' "$meta" | awk '/flavor: alpine-virt/{f=1} f&&/file:/{print $2; exit}')
          asum=$(printf '%s\n' "$meta" | awk '/flavor: alpine-virt/{f=1} f&&/sha256:/{print $2; exit}')
          curl -fsSL --retry 3 -o /tmp/alpine-virt.iso "$AMIRROR/$afile"
          echo "$asum  /tmp/alpine-virt.iso" | sha256sum -c --quiet
          mkdir -p /tmp/lgt-out
          python3 -u crates/horcrux-guest-tools/tests/linux_guest_e2e.py \
            target/x86_64-unknown-linux-musl/release/horcrux-guest-agent /tmp/alpine-virt.iso /tmp/lgt-out
          cat /tmp/lgt-out/linux-guest-e2e.json

      - name: Same-host frame ring e2e (ivshmem, guest tools writer, native viewer reader)
        run: |
          cargo build -p horcrux-viewer --release
          mkdir -p /tmp/shm-out
          for vga in std virtio; do
            HXSHM_VGA=$vga python3 -u crates/horcrux-viewer/tests/shm_guest_e2e.py \
              target/x86_64-unknown-linux-musl/release/horcrux-guest-agent target/release/horcrux-viewer \
              /tmp/alpine-virt.iso /tmp/shm-out/$vga
            cat /tmp/shm-out/$vga/shm-guest-e2e.json
          done

      - name: Checksums of what was built
        if: always()
        # No artifact upload: the Forgejo artifact backend fails the finalize
        # step of upload-artifact on this instance (see docs.yml). Shipping the
        # tools to nodes is the packaging work of phase C2b.
        run: sha256sum dist/horcrux-guest-tools-*-x64.msi dist/horcrux-guest-tools.iso dist/linux/x86_64/horcrux-guest-tools.* target/x86_64-unknown-linux-musl/release/horcrux-guest-agent 2>/dev/null || true

  viewer-window:
    name: Viewer window on headless sway (KVM)
    runs-on: kvm-x86_64
    container: catthehacker/ubuntu:act-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: https://github.com/dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Ubuntu mirror failover (build-cache hub)
        run: curl -fsS -m 5 http://10.1.10.103:8088/ci/apt-mirror.sh | sh || true
      - name: Install tools (build, QEMU, compositor)
        run: |
          for i in 1 2 3; do
            sudo apt-get update -qq || true
            apt-cache policy sway | grep -q 'Candidate: [0-9]' && break
            sleep 15
          done
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            build-essential clang musl-tools libvirt-dev libpam0g-dev qemu-system-x86 qemu-utils \
            qemu-system-modules-opengl ffmpeg xorriso curl xkb-data sway grim python3
          ls -l /dev/kvm
          sway --version
          qemu-system-x86_64 -display help | grep -x dbus

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-viewer-window-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-viewer-window-

      - name: Build node, viewer, Linux agent
        run: |
          cargo build -p horcrux-api --all-features
          cargo build -p horcrux-viewer
          cargo build -p horcrux-guest-tools --release --target x86_64-unknown-linux-musl

      - name: Viewer window e2e (sway headless, grim screenshots, typed keys)
        run: |
          set -o pipefail
          HXW_OUT=/tmp/hxw-out bash crates/horcrux-viewer/tests/viewer_window_e2e.sh \
            target/debug/horcrux-api target/debug/horcrux-viewer \
            target/x86_64-unknown-linux-musl/release/horcrux-guest-agent 2>&1 | tee /tmp/hxw-e2e.log

      - name: Screenshots
        if: always()
        # Same instance limitation as above (docs.yml): the upload may fail,
        # which must not turn a passing test red.
        continue-on-error: true
        uses: actions/upload-artifact@v3
        with:
          name: viewer-window-screenshots
          path: |
            /tmp/hxw-out/*.png
            /tmp/hxw-out/*.json
            /tmp/hxw-out/*.log
            /tmp/hxw-e2e.log
          if-no-files-found: warn

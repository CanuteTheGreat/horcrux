name: Gaming VM wizard (Windows 11 install, KVM)

# The Gaming VM wizard end to end on real KVM (docs/design/gaming-vm.md,
# phase 2): the server fetches the Windows 11 evaluation ISO and virtio-win
# into its ISO library, POST /api/vms/gaming composes the VM (Secure Boot
# OVMF with Microsoft keys, swtpm TPM 2.0, pinned vCPUs, virtio disk, guest
# agent, generated SMBIOS identity, answer disc), Windows installs unattended
# until its guest agent answers (the server then deletes the answer disc),
# and Secure Boot, TPM 2.0, SMBIOS and the virtio drivers are checked from
# inside Windows. VBS follows the wizard's default (VBS=auto): the runners
# are themselves VMs, so the wizard leaves VBS off and the test checks it is
# off inside; the plan with VBS asked for is still checked (nested
# virtualisation). VBS + Memory Integrity running inside is checked on a
# bare-metal host (or with VBS=on). No GPU (the runners have none). Needs
# /dev/kvm (kvm-x86_64 runner). A Windows install takes 30-60 min,
# so it runs on changes to the wizard, weekly and on dispatch.
on:
  push:
    branches: [main]
    paths:
      - 'crates/horcrux-vm/src/vm/gaming.rs'
      - 'crates/horcrux-vm/src/vm/firmware.rs'
      - 'crates/horcrux-vm/data/gaming-compat.toml'
      - 'horcrux-api/src/api/gaming.rs'
      - 'horcrux-api/tests/gaming_wizard_e2e.*'
      - '.forgejo/workflows/gaming-wizard-e2e.yml'
  schedule:
    - cron: '20 4 * * 3'
  workflow_dispatch: {}

concurrency:
  group: "replace:${{ github.workflow }}@${{ github.ref }}"
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  gaming-wizard-e2e:
    name: Gaming VM wizard installs Windows 11 (Secure Boot, TPM, SMBIOS checked inside)
    runs-on: kvm-x86_64
    container: catthehacker/ubuntu:act-26.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: https://github.com/dtolnay/rust-toolchain@stable

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential clang libvirt-dev libpam0g-dev \
            qemu-system-x86 qemu-utils ovmf swtpm swtpm-tools xorriso curl python3
          ls -l /dev/kvm
          cat /sys/module/kvm_intel/parameters/nested /sys/module/kvm_amd/parameters/nested 2>/dev/null || true

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-gaming-wizard-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-gaming-wizard-

      - name: Build horcrux-api
        run: cargo build -p horcrux-api --all-features

      - name: Install Windows 11 through the wizard and check it from inside
        run: |
          HX_DATA=/tmp/hx-gaming-wizard bash horcrux-api/tests/gaming_wizard_e2e.sh target/debug/horcrux-api

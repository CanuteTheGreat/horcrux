name: Nightly Realistic VM/Container/CNI Test

# Deliberately NOT triggered on push/PR - this is an expensive, genuinely
# end-to-end validation (real QEMU boot, real Docker containers, real CNI
# networking) that belongs on a schedule / manual dispatch, not on every
# commit. The lightweight per-push checks remain exactly as-is in ci.yml.
on:
  workflow_dispatch: {}
  schedule:
    # 09:00 UTC == ~02:00 America/Los_Angeles
    - cron: '0 9 * * *'

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  realistic-test:
    name: Realistic VM + Container + CNI test
    # Pinned to the beauxbatons runner specifically: it's the one with a
    # real Docker Desktop daemon (automounted into job containers) sitting
    # on a genuine Linux kernel (Docker Desktop's LinuxKit VM), so
    # qemu-system-x86_64, docker, and ip-netns/CNI all behave like a real
    # Linux host from inside this privileged container - not a sandboxed
    # fake. See the multi-arch tag note in ci.yml for why we use a tag
    # here too, not a single-platform digest.
    runs-on: x86_64
    # Matches ci.yml's existing tag choice (see its comment): a multi-arch
    # tag, not a single-platform sha256 digest, so this works regardless
    # of which labeled runner/platform variant picks up the job. The
    # runner's own config.yaml already sets `privileged: true` globally
    # (required for Docker-in-Docker / nested docker), so no per-job
    # container.options override is needed here.
    container: catthehacker/ubuntu:act-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Ensure Node.js is present (self-heal)
        # This job's container (catthehacker/ubuntu:act-latest) is reused
        # by the beauxbatons runner across many job runs instead of being
        # recreated per-run (confirmed via `docker ps -a` in a prior failed
        # run showing other jobs' containers still alive hours later). On
        # 2026-10-05 node vanished mid-job from a long-lived container
        # between the "Verify tool versions" and "Cache cargo registry"
        # steps, breaking actions/cache and actions/checkout's post step
        # (both are JS actions that shell out to `node`). Root cause is a
        # runner/container-lifecycle issue outside this repo, but we can
        # cheaply self-heal here rather than fail the whole nightly run.
        run: |
          if ! command -v node >/dev/null 2>&1; then
            echo "::warning::node missing from job container PATH - reinstalling (see container-reuse note in this step)"
            sudo apt-get update -qq
            sudo apt-get install -y nodejs
          fi
          node --version

      - name: Install Rust toolchain
        uses: https://github.com/dtolnay/rust-toolchain@stable

      # --- Architecture note -------------------------------------------
      # UTM (/Applications/UTM.app on beauxbatons) was evaluated for real
      # hardware-accelerated VM boot (HVF for same-arch guests, a patched
      # JIT-accelerated QEMU for x86_64-on-arm64). It was NOT used here:
      # utmctl only works via macOS Apple Events from the interactive GUI
      # session, and this job's steps execute as a process tree *inside a
      # Linux container* started by Docker Desktop (confirmed: no
      # /Applications, no macOS binaries, different kernel/OS entirely
      # from the logged-in GUI session that owns UTM). Reaching UTM would
      # require a separate *host-mode* (non-container) runner execution
      # path, which beauxbatons-x86-emulated is not currently registered
      # for, and would add GUI-session-availability as a new failure mode
      # for marginal benefit: our boot target (CirrOS, ~20MB) reaches its
      # login prompt in well under a minute under plain QEMU/TCG software
      # emulation, so hardware acceleration isn't needed for a meaningful
      # pass/fail signal. We instead validate a *genuinely real* QEMU
      # guest boot (real kernel executing, real serial console output)
      # entirely inside this privileged Linux container - see
      # horcrux-api/tests/nightly_realistic_tests.rs::test_real_qemu_vm_boot.
      - name: Install build deps, real QEMU, CNI plugins, and net tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential libvirt-dev \
            qemu-system-x86 qemu-utils \
            containernetworking-plugins \
            iproute2 iputils-ping curl

          # Debian's containernetworking-plugins package ships the real
          # upstream CNI binaries (bridge, host-local, ptp, ...) under
          # /usr/lib/cni - point NIGHTLY_CNI_BIN_DIR at wherever they
          # actually landed.
          if [ -d /usr/lib/cni ]; then
            echo "NIGHTLY_CNI_BIN_DIR=/usr/lib/cni" >> "$GITHUB_ENV"
          elif [ -d /opt/cni/bin ]; then
            echo "NIGHTLY_CNI_BIN_DIR=/opt/cni/bin" >> "$GITHUB_ENV"
          else
            echo "No CNI plugin binaries found after install" >&2
            exit 1
          fi

      - name: Download real CirrOS test-cloud-image
        # CirrOS is the tiny (~20MB) test-cloud-image the OpenStack project
        # publishes specifically for exercising hypervisors end to end -
        # it boots to a login prompt in seconds even under pure software
        # emulation, which is exactly what we need for a fast but genuine
        # boot test. Cached by exact version/checksum-bearing URL.
        run: |
          mkdir -p /tmp/horcrux-nightly
          curl -fsSL -o /tmp/horcrux-nightly/cirros-disk.img \
            https://download.cirros-cloud.net/0.6.2/cirros-0.6.2-x86_64-disk.img
          echo "NIGHTLY_CIRROS_IMAGE=/tmp/horcrux-nightly/cirros-disk.img" >> "$GITHUB_ENV"
          ls -lh /tmp/horcrux-nightly/cirros-disk.img

      - name: Verify tool versions (qemu, docker, CNI)
        run: |
          qemu-system-x86_64 --version
          qemu-img --version
          docker version
          ls -la "$NIGHTLY_CNI_BIN_DIR"

      - name: Ensure Node.js is present (self-heal, pre-cache)
        # Second check, right before the next node-dependent (JS) action.
        # This job's container (catthehacker/ubuntu:act-latest) is reused
        # by the beauxbatons runner across many job runs instead of being
        # recreated per-run (confirmed via `docker ps -a` in a prior failed
        # run showing other jobs' containers still alive hours later). On
        # 2026-10-05 node vanished mid-job from a long-lived container
        # between the "Verify tool versions" and "Cache cargo registry"
        # steps, breaking actions/cache and actions/checkout's post step
        # (both are JS actions that shell out to `node`). Root cause is a
        # runner/container-lifecycle issue outside this repo, but we can
        # cheaply self-heal here rather than fail the whole nightly run.
        run: |
          if ! command -v node >/dev/null 2>&1; then
            echo "::warning::node missing from job container PATH - reinstalling (see container-reuse note in this step)"
            sudo apt-get update -qq
            sudo apt-get install -y nodejs
          fi
          node --version

      - name: Preflight - probe mount-namespace capability (fail-soft, not fail-fast)
        # Confirmed root cause (2026-10-07, run 2617/job 12573): `unshare
        # --mount` itself returns a flat "Operation not permitted" on
        # this runner - not an ownership/capability nuance, a
        # syscall-level denial. That points at Docker Desktop's Enhanced
        # Container Isolation (or an equivalent seccomp/AppArmor
        # profile) blocking CLONE_NEWNS outright for job containers on
        # beauxbatons, which no amount of in-container root/privileged
        # tricks can work around - it has to be disabled/exempted at
        # the Docker Desktop/runner config level on the host itself
        # (owner action, not a repo fix).
        #
        # This used to hard-fail the whole job here (exit 1) before the
        # ~1-2 minute cargo build even started. That was wrong: this
        # test binary actually covers THREE independent scenarios -
        # test_real_qemu_vm_boot, test_real_docker_container_lifecycle,
        # and test_real_cni_networking - and only the last one touches
        # `ip netns`/CLONE_NEWNS. Failing fast here threw away a real,
        # working nightly signal on real QEMU VM boot and real Docker
        # container lifecycle every single night just because of a
        # known, already-diagnosed, unrelated host limitation blocking
        # the CNI sub-test. Mirrors the same fix already applied to
        # nightly-stress-test.yml's CNI isolation step (2026-10-07).
        run: |
          if unshare --mount --propagation private -- true 2>/tmp/unshare-probe.err; then
            echo "NIGHTLY_NETNS_OK=true" >> "$GITHUB_ENV"
            echo "mount-namespace capability available"
          else
            echo "NIGHTLY_NETNS_OK=false" >> "$GITHUB_ENV"
            echo "::warning::unshare --mount is blocked on this runner ($(cat /tmp/unshare-probe.err | tr -d '\n')). This is almost certainly Docker Desktop's Enhanced Container Isolation (or an equivalent seccomp/AppArmor profile) denying CLONE_NEWNS for job containers on beauxbatons. It must be disabled/exempted for this runner at the Docker Desktop / forgejo-runner config level on the host - no workflow-level or in-container fix can work around a host-enforced syscall denial. test_real_cni_networking will be skipped (not faked as a pass) this run; test_real_qemu_vm_boot and test_real_docker_container_lifecycle are unaffected and still run below."
          fi

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-nightly-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-nightly-
            ${{ runner.os }}-cargo-

      - name: Run real QEMU VM boot + real Docker container tests
        # These two scenarios need no mount-namespace tricks at all, so
        # they run unconditionally regardless of the CLONE_NEWNS probe
        # above - real signal every night even while the CNI sub-test
        # is blocked by beauxbatons' host-level isolation policy.
        env:
          NIGHTLY_VM_STORAGE: /tmp/horcrux-nightly/vms
        run: |
          cargo test --test nightly_realistic_tests -p horcrux-api \
            -- --ignored --test-threads=1 --nocapture \
            test_real_qemu_vm_boot \
            test_real_docker_container_lifecycle

      - name: Run real CNI networking test
        if: env.NIGHTLY_NETNS_OK == 'true'
        # Mount-namespace note: a prior fix here ran a standalone
        # `sudo mount --make-rshared /` step before this one, hoping to
        # flip the *existing* (inherited) mount namespace's root to
        # shared propagation so `ip netns add`'s internal
        # `mount --make-shared /run/netns` would stop failing with
        # "Operation not permitted". It didn't work (still failed
        # identically in job 12449, 2026-10-06) because Linux only lets
        # you change a mount's propagation type if you're in (or have
        # CAP_SYS_ADMIN in) the user namespace that *owns* that mount's
        # peer group - and on Docker Desktop's LinuxKit VM, this job
        # container's inherited root mounts (including /run) are owned
        # by a namespace outside this container's reach even though the
        # container itself runs as root with `privileged: true`.
        # Simply being root here isn't the same as owning that
        # namespace, so re-sharing the *inherited* mount namespace from
        # inside the container can't work no matter how it's invoked.
        #
        # Fix: `unshare --mount` creates a brand-new mount namespace
        # *owned by the process creating it* - i.e. us, right now, as
        # root - so we fully own it and can freely flip its propagation
        # with `mount --make-rshared /` from inside, with no
        # cross-namespace ownership restriction in the way. Both the
        # propagation fix and the actual test run happen inside that
        # same freshly-created, self-owned namespace.
        env:
          NIGHTLY_CNI_CONF_DIR: /tmp/horcrux-nightly/cni-conf
        run: |
          sudo --preserve-env=NIGHTLY_CNI_CONF_DIR,NIGHTLY_CNI_BIN_DIR,PATH \
            unshare --mount --propagation private -- bash -c '
              set -e
              mount --make-rshared /
              cargo test --test nightly_realistic_tests -p horcrux-api \
                -- --ignored --test-threads=1 --nocapture \
                test_real_cni_networking
            '

      - name: Skip notice - real CNI networking test
        if: env.NIGHTLY_NETNS_OK != 'true'
        run: |
          echo "SKIPPED test_real_cni_networking: this runner denies CLONE_NEWNS (ip netns unavailable in this container). See the 'Preflight' step above for the full explanation. This is an environment limitation, not a passing or faked result."

      - name: Diagnostics on failure
        if: failure()
        run: |
          echo "--- VM serial logs ---"
          find /tmp/horcrux-nightly/vms -name '*.serial.log' -exec sh -c 'echo "== {} =="; cat "{}"' \; 2>/dev/null || true
          echo "--- docker ps -a ---"
          docker ps -a || true
          echo "--- leftover netns ---"
          ip netns list || true
          echo "--- leftover bridges ---"
          ip link show type bridge || true

      - name: Clean up disk usage
        if: always()
        # Resource budget: this job must not leave orphaned VM disks,
        # docker containers, netns, or bridges lying around between runs.
        # The tests themselves clean up their own resources even on
        # assertion failure (see their teardown blocks), this is a backstop.
        run: |
          rm -rf /tmp/horcrux-nightly
          docker ps -a --filter "name=horcrux-nightly" -q | xargs -r docker rm -f || true
          for ns in hcx-nightly-ns1 hcx-nightly-ns2; do
            ip netns del "$ns" 2>/dev/null || true
          done
          ip link del hcx-nightly0 2>/dev/null || true
          df -h / || true

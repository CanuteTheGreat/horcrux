# Daily + release ISO for horcrux (Gentoo live/installer; x86_64 UEFI+BIOS hybrid, aarch64 UEFI).
#
#  * schedule : build from main, QEMU boot + unattended install + reboot + web probe
#               (UEFI+USB and BIOS+CD), publish ONLY if everything passed, to the rolling
#               PRE-release `daily` (stable URL, assets replaced in place).
#  * v* tag   : same build + tests from the tag, attached to that release as a stable ISO
#               (criteria: docs/ISO-INSTALL.md "Stable ISO criteria").
#  * The job never fails on a build/test problem (a red run e-mails the owner): the result is
#    written to the `daily-status` release marker and the job summary instead.
# One job per architecture, each BUILT NATIVELY and tested under QEMU on its own runner label:
#   x86_64  kvm-x86_64  (rw-man-01 colo, /dev/kvm, host docker)  -> <product>-daily-x86_64.iso
#   aarch64 arm64       (rw-man-04/05 Graviton, host docker; no /dev/kvm there, so QEMU runs TCG, timeouts x3)  -> <product>-daily-aarch64.iso
#   (riscv64 is not in the matrix: see docs/ISO-INSTALL.md "riscv64" - no native runner, no rust image)
# Each arch publishes its own asset set and its own status marker (daily-status, daily-status-aarch64) so one failing
# arch never blocks the other. BuildKit cache mounts (binpkgs,
# distfiles, ccache, cargo target) persist on the host, so a cached daily takes minutes, not hours.
name: Live ISO

on:
  schedule:
    - cron: '0 11 * * *'   # ~04:00 America/Los_Angeles: after the 09:00-10:50 UTC nightlies on the kvm runner
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      mode:
        description: 'daily (publish to the rolling pre-release) or dry (build + test only)'
        required: false
        default: 'dry'

concurrency:
  group: live-iso-horcrux
  cancel-in-progress: false

jobs:
  live-iso:
    name: Build + test + publish live ISO (${{ matrix.arch }}${{ matrix.variant && format(' {0}', matrix.variant) || '' }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: kvm-x86_64
          - arch: aarch64
            runner: arm64
          # Desktop variant (GNOME, encrypted ZFS + hibernate, Apple T2 ready, no Apple firmware): its own asset
          # horcrux-desktop-daily-x86_64.iso (~2.0 GB: the build refuses to publish it when it reaches 2 GiB)
          - arch: x86_64
            runner: kvm-x86_64
            variant: desktop
    runs-on: ${{ matrix.runner }}
    container: catthehacker/ubuntu:act-latest
    timeout-minutes: 300
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Build, test, publish
        env:
          FORGEJO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_RELEASE_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}   # public GitHub mirror release (second publish step)
          ARCH: ${{ matrix.arch }}
          VARIANT: ${{ matrix.variant }}
          JOBS: '4'
        run: |
          set -u
          case "${GITHUB_REF_TYPE:-}" in
            tag) mode=stable ;;
            *)   mode=daily ;;
          esac
          if [ "${GITHUB_EVENT_NAME}" = workflow_dispatch ] && [ "${{ github.event.inputs.mode }}" != daily ]; then
            # dry run: no token => nothing is published
            FORGEJO_TOKEN= bash build/live-iso/common/ci-run.sh "$mode"
          else
            bash build/live-iso/common/ci-run.sh "$mode"
          fi

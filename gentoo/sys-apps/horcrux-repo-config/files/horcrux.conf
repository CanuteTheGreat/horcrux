# The Horcrux overlay (ebuilds of every Horcrux machine: horcrux-gnome-defaults, horcrux-backup, horcrux-tools, kernel configs, ...).
# Owned by sys-apps/horcrux-repo-config; `emaint sync` (or `emerge --sync`) pulls overlay updates, so `emerge -uDN @world` sees new revisions.
[horcrux]
location = /var/db/repos/horcrux
masters = gentoo
sync-type = git
sync-uri = https://git.canutethegreat.com/CanuteTheGreat/horcrux-overlay.git
sync-depth = 1
auto-sync = yes

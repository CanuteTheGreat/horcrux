# Horcrux automatic updates (sys-apps/horcrux-autoupdate). Updates are ON by default; the machine is never rebooted.
# Everything here is optional: delete a line to get its default. `horcrux-autoupdate status` shows the last result.
#
# ENABLED=no                 turn the service off (the schedule stays installed and does nothing)
# INTERVAL_HOURS=24          one attempt per this many hours (the trigger runs hourly, so a machine that was off at night catches up)
# SYNC=yes                   emaint sync -a first
# SYNC_RETRIES=2             a repository whose sync failed (bad rsync mirror) is synced again on its own this many times
# SYNC_RETRY_DELAY=120       seconds before each retry
# SYNC_MAX_AGE_HOURS=48      the gentoo tree must be at most this old after the sync step
# SNAPSHOT=yes               ZFS root: boot-environment snapshot first (horcrux-be), no snapshot = no update
# DEPCLEAN=safe              safe | no. safe: emerge --depclean of the unneeded packages minus kernel/ZFS/boot/firmware/Horcrux ones, at most DEPCLEAN_MAX
# DEPCLEAN_MAX=20
# WITH_BDEPS=no              yes: also keep the BUILD dependencies of installed packages updated (--with-bdeps=y). Off: a server does not accumulate compilers, headers and X11 libraries
# PRESERVED_REBUILD=yes      emerge @preserved-rebuild when Portage preserved libraries
# ETC_UPDATE=preen           preen: etc-update --preen (trivial changes only) | all: --automode -5 (replaces edited config files) | off
# SKIP_ON_BATTERY=yes        laptops: wait for AC power
# STALE_DAYS=3               `horcrux-autoupdate check` warns after this many days without a success, critical after twice that
# MAX_RUNTIME_HOURS=12
# EXTRA_EMERGE_OPTS=""

# OpenRC's containerd init script waits containerd_socket_delay seconds (default 5) for /run/containerd/containerd.sock after starting the daemon and marks
# the service FAILED when the socket is not there yet, leaving the daemon running; docker then refuses to start ("cannot start docker as containerd would
# not start") and every later start says "already running". A slow disk or an emulated CPU needs longer than 5 s (aarch64 TCG on a ZFS root); ewaitfile
# returns as soon as the socket appears, so a fast host still starts in the same time.
containerd_socket_delay=120

# sys-apps/horcrux-core: /etc/rc.conf.d/horcrux-host.conf
# A Horcrux install is a HOST: OpenRC must never treat it as a container.
#
# With rc_sys unset, OpenRC guesses the system type at every boot, and an empty /.dockerenv or /run/.containerenv (left by the
# container that built the image, by `docker export`, or by any tool that unpacks a container rootfs onto the disk) makes it say
# "docker"/"podman". It then silently skips every service with `keyword -docker` / `-containers`: devfs, sysfs, udev, udev-trigger,
# root (the read-write remount), fsck, localmount, cgroups, hostname, modules. The machine boots with a read-only root, no device
# drivers loaded (no network, only `lo`), and elogind, the display manager and every daemon that writes to disk failing.
#
# The image builds used to write rc_sys="" into /etc/rc.conf, but rc.conf belongs to sys-apps/openrc: an OpenRC update offers a stock
# rc.conf (#rc_sys="" commented) as ._cfg0000_rc.conf, and merging it removed the setting with a diff that looks comment-only.
# This file is package-owned and survives OpenRC updates. rc.conf.d/*.conf is read after /etc/rc.conf, in name order, and a later
# file wins: to run a Horcrux userland inside a real container or VM type, set rc_sys in /etc/rc.conf.d/zz-local.conf
# (values: see `man openrc-run` / the comment above rc_sys in /etc/rc.conf), never here.
rc_sys=""

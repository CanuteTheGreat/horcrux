# owned by app-misc/horcrux-tmux-config (system-wide /etc/tmux.conf; ~/.tmux.conf still wins/extends it).
# Makes copy work on a desktop: a mouse drag (or a copy-mode yank) lands in the desktop clipboard, not only in tmux's own buffer.
# It never switches `mouse` on or off: that stays the user's choice. Holding Shift while dragging still bypasses tmux (terminal-native select).
# Headless (no WAYLAND_DISPLAY/DISPLAY) the helper does nothing and copying stays tmux-internal (+ OSC 52 below).

# OSC 52 for terminals that support it (kitty, foot, alacritty, wezterm, ...); VTE terminals (GNOME Terminal, Terminator) do not, hence the helper.
set -g set-clipboard external

# The helper picks wl-copy or xclip at copy time from the session's environment, so it also works for a server started from ssh or another session.
set -g copy-command "/usr/bin/horcrux-clip-copy"
set -ga update-environment " WAYLAND_DISPLAY XDG_RUNTIME_DIR"

# Drag ends: copy and KEEP the selection highlighted (stock copy-pipe-and-cancel clears it, which looked like "nothing was copied").
bind -T copy-mode    MouseDragEnd1Pane send -X copy-pipe-no-clear
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-no-clear
# Double-click = word, triple-click = line, same treatment.
bind -n DoubleClick1Pane select-pane -t= \; if -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" { send -M } { copy-mode -H; send -X select-word; run -d0.3; send -X copy-pipe-no-clear }
bind -n TripleClick1Pane select-pane -t= \; if -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" { send -M } { copy-mode -H; send -X select-line; run -d0.3; send -X copy-pipe-no-clear }
bind -T copy-mode    DoubleClick1Pane select-pane \; send -X select-word \; run -d0.3 \; send -X copy-pipe-no-clear
bind -T copy-mode-vi DoubleClick1Pane select-pane \; send -X select-word \; run -d0.3 \; send -X copy-pipe-no-clear
bind -T copy-mode    TripleClick1Pane select-pane \; send -X select-line \; run -d0.3 \; send -X copy-pipe-no-clear
bind -T copy-mode-vi TripleClick1Pane select-pane \; send -X select-line \; run -d0.3 \; send -X copy-pipe-no-clear

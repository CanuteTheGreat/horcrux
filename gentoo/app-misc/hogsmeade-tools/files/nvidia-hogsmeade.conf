# HOGSMEADE: NVIDIA open modules (Blackwell has no proprietary-module flavour), hybrid graphics: the Intel iGPU drives the
# panel, the dGPU renders on demand (prime-run / switcheroo-control "Launch using Discrete Graphics Card") and for ComfyUI.
blacklist nouveau
options nouveau modeset=0
options nvidia-drm modeset=1 fbdev=1
# open modules: video-memory preservation across hibernate/suspend is done through kernel suspend notifiers
options nvidia NVreg_UseKernelSuspendNotifiers=1 NVreg_PreserveVideoMemoryAllocations=1 NVreg_TemporaryFilePath=/var/tmp

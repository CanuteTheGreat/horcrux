# /etc/conf.d/horcrux-test-watchdog - settings of /usr/libexec/horcrux-test-watchdog (owned by app-misc/horcrux-test-machine).
# Sourced by the daemon itself, so it works the same under OpenRC and systemd. KEY=value only (shell syntax).
# Edit here (or in /etc/conf.d/horcrux-test-watchdog.local, which wins and survives package updates).

# seconds between pets. Must stay well below the shortest timeout below.
WDT_PET=5
# hardware watchdog (iTCO_wdt or the platform's) reset timeout in seconds; empty = driver default (30 s on iTCO_wdt)
WDT_HW_TIMEOUT=30
# also arm softdog next to the hardware watchdog: yes|no. Some iTCO_wdt units accept pets but never reset (TCO_LOCK set).
WDT_SOFTDOG=yes
# softdog reset timeout in seconds
WDT_SOFT_MARGIN=60
# the pet is withheld unless a small write + fdatasync on the local root filesystem completes within this many seconds
WDT_PROBE_TIMEOUT=15
# watchdog device to use: auto (prefers iTCO) or a path such as /dev/watchdog0
WDT_DEVICE=auto

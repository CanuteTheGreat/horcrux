# app-misc/horcrux-test-machine: a TEST machine never sleeps on lid / key / idle (owner rule 2026-11-04). Sorts after the installer's
# 10-horcrux-portable.conf (lid=suspend) and overrides it. Remove the package to get normal laptop power behaviour back.
[Login]
HandleLidSwitch=ignore
HandleLidSwitchExternalPower=ignore
HandleLidSwitchDocked=ignore
HandleSuspendKey=ignore
HandlePowerKey=ignore
HandleHibernateKey=ignore
IdleAction=ignore

# app-misc/horcrux-test-machine: /usr/libexec/horcrux-test-netwatch (read by the script itself; OpenRC and systemd alike)
# Wi-Fi up but no connectivity: reload the driver after GRACE s, at most every COOLDOWN s; poll every INTERVAL s
#GRACE=300
#INTERVAL=30
#COOLDOWN=900
# No interface up besides lo NOLINK_SECS after boot: coldplug devices + restart NetworkManager (NOLINK_FIX=no turns it off)
#NOLINK_SECS=180
#NOLINK_COOLDOWN=900
#NOLINK_FIX=yes
# Boot health (written once, NOLINK_SECS after boot): verdict=bad when one of these is not started, the init system thinks it runs in a
# container, / is read-only or no link is up
#CRITICAL="devfs udev udev-trigger root localmount NetworkManager sshd"
#HEALTH_FILE=/run/horcrux-test-boot-health
#LOG=/var/log/horcrux-netwatch.log

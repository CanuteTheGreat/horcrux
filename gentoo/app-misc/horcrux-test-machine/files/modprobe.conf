# app-misc/horcrux-test-machine: driver-level Wi-Fi power saving off (options for absent modules are ignored)
options iwlwifi power_save=0 uapsd_disable=3
options iwlmvm power_scheme=1
# Marvell 88W8797 (Surface Pro 1, attached over USB as mwifiex_usb): firmware auto deep sleep off
options mwifiex disable_auto_ds=1

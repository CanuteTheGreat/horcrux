# /etc/conf.d/horcrux-test-klog - settings of /usr/libexec/horcrux-test-klog (owned by app-misc/horcrux-test-machine).
# Sourced by the script itself, so it works the same under OpenRC and systemd. KEY=value only (shell syntax).
# Edit here (or in /etc/conf.d/horcrux-test-klog.local, which wins and survives package updates).

# file the kernel log is appended to (rotated by /etc/logrotate.d/horcrux-test-machine)
KLOG_FILE=/var/log/kernel-test.log
# seconds between wall-clock marker lines ("== MARK wall=... up=... boot_id=...") used to date the boot-relative stamps
KLOG_MARK_SECS=60
# arguments of dmesg (boot-relative stamps by default; --follow is required)
KLOG_DMESG_ARGS="--follow --kernel"

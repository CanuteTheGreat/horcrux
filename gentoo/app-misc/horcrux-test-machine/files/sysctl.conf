# app-misc/horcrux-test-machine: a kernel that panics or locks up reboots itself (a test laptop has nobody at the keyboard).
# Override any value in a later file, e.g. /etc/sysctl.d/90-local.conf. A leading '-' ignores a key the running kernel lacks.
# seconds before a panicked kernel reboots (configurable; 10 s keeps the panic message readable on the serial/pstore log)
kernel.panic = 10
kernel.panic_on_oops = 1
kernel.softlockup_panic = 1
-kernel.hardlockup_panic = 1
-kernel.nmi_watchdog = 1
# hung tasks (D state longer than the timeout): panic -> reboot. Only exists when the kernel has CONFIG_DETECT_HUNG_TASK
# (the Gentoo dist-kernel 6.18 does not, so there the watchdog's root-fs write probe is what catches a stuck disk).
-kernel.hung_task_panic = 1
-kernel.hung_task_timeout_secs = 240

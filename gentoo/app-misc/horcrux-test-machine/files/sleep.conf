# app-misc/horcrux-test-machine: a TEST machine can never be put to sleep, by anything (owner rule 2026-11-04).
# logind's Handle*=ignore only covers lid/keys/idle INSIDE elogind. A desktop session's own power manager
# (xfce4-power-manager's inactivity timer, 14 min) calls Suspend over D-Bus: madammalkins was suspended that way at
# 2026-11-06 19:11 with nothing to wake it and looked hung for 2.5 h. With Allow*=no elogind refuses every sleep request
# (CanSuspend=na), whoever asks. Sorts after 10-horcrux-portable.conf (AllowSuspend=yes) and overrides it.
[Sleep]
AllowSuspend=no
AllowHibernation=no
AllowHybridSleep=no
AllowSuspendThenHibernate=no

# Touch (hid-multitouch) and pen: libinput for touch, xf86-input-wacom for the Wacom digitizer; the modesetting driver for the HD 4000
Section "InputClass"
    Identifier "horcrux touch via libinput"
    MatchIsTouchscreen "on"
    MatchDevicePath "/dev/input/event*"
    Driver "libinput"
EndSection
Section "InputClass"
    Identifier "horcrux pen via wacom"
    MatchIsTablet "on"
    MatchDevicePath "/dev/input/event*"
    Driver "wacom"
EndSection

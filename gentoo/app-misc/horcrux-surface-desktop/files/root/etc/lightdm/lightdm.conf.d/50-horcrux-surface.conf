# Horcrux Surface: LightDM with the GTK greeter + XFCE session; the on-screen keyboard (onboard) is offered in the greeter
[LightDM]
minimum-vt=7
# the greeter shows a login screen to anyone at the machine: it must never run as root (lab finding 2026-11-04: it ran as root on the Surface). Explicit,
# not left to the compiled-in default; gate: surface-xfce-test (greeter process user) + tests/test_surface.py (this file).
greeter-user=lightdm

[Seat:*]
greeter-session=lightdm-gtk-greeter
user-session=xfce
greeter-hide-users=false
allow-guest=false

# Marvell 88W8797 (mwifiex_pcie) Wi-Fi power save has known firmware hangs/disconnects on Surface devices
# (linux-surface wiki "Marvell 88W8897 quirks"; the same mwifiex driver serves the SP1's 88W8797): keep it off.
# The kernel default is also off; this keeps NetworkManager from enabling it.
[connection]
wifi.powersave = 2

[device]
wifi.backend = wpa_supplicant

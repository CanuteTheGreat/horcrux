# Apple T2 Macs: the internal keyboard/trackpad/Touch Bar are USB devices behind the T2 (apple-bce "t2bce" = virtual USB host).
# Without these modules in the initramfs the keyboard is dead at LUKS / ZFS-passphrase / emergency prompts.
# force_drivers = loaded before udev settles, i.e. early; add_drivers = just present.
force_drivers+=" t2bce_core t2bce_dma t2bce_vhci hid_apple hid_appletb_kbd hid_appletb_bl usbhid hid_generic hid_multitouch "
add_drivers+=" t2bce_audio appletbdrm i915 nvme nvme_core thunderbolt xhci_pci xhci_hcd usb_storage uas "

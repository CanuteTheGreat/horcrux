# Horcrux guest tools settings (key = value). Every key has a built-in
# default; uncomment to override. `horcrux-guest-agent --help` lists them.
#port = /dev/virtio-ports/org.horcrux.console.0
#capture = auto          # auto | kmsgrab | x11grab
#encoder = auto          # auto | nvenc | vaapi | software
#ffmpeg = ffmpeg
#drm_card = /dev/dri/card0
#vaapi_device = /dev/dri/renderD128
#x264_preset = ultrafast
#clipboard_poll_ms = 500
#clipboard_max_bytes = 1048576
#audio_source = default
#reconnect_ms = 1000
#input_device_name = Horcrux virtual input
# Hibernate for passthrough VMs (docs/SAVE_STATE.md): the node asks the guest to hibernate
# when the host shuts down. The install step prepares swap and the resume device.
#hibernate_at_install = true
#hibernate_swap_pct = 100         # swap needed, % of RAM (also the swap file size)
#hibernate_swapfile = /swap-horcrux.img
#hibernate_command =              # empty = systemctl / loginctl / pm-hibernate / s2disk
#hibernate_delay_ms = 3000

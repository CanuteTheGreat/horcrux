# Horcrux Console desktop client settings (defaults).
# Copy to your settings file and set node and vm, or leave them empty to
# use the connection window: ~/.config/horcrux/console.toml (Linux),
# %APPDATA%\horcrux\console.toml (Windows), ~/Library/Application
# Support/horcrux/console.toml (macOS). Every key can also be given on the
# command line (horcrux-console --help); this file is
# `horcrux-console --print-defaults`.
node = ""
user = "root"
password_env = "HORCRUX_PASSWORD"
vm = ""
profile = ""
ca_file = ""
cert_sha256 = ""
decoder = "auto"
hardware_decode = true
avcodec = ["libavcodec.so.62", "libavcodec.so.61", "libavcodec.so.60", "libavcodec.so.59", "libavcodec.so.58", "libavcodec.so"]
avutil = ["libavutil.so.60", "libavutil.so.59", "libavutil.so.58", "libavutil.so.57", "libavutil.so.56", "libavutil.so"]
release_key = "ControlRight"
relative_mouse = "auto"
fullscreen = false
gamepads = true
gamepad_poll_hz = 250
refresh_hz = 0
width = 1280
height = 800
connect_timeout_ms = 15000
remember_connection = true
ui_scale = 0

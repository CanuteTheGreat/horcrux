[package]
name = "horcrux-api"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[lib]
name = "horcrux_api"
path = "src/lib.rs"

[[bin]]
name = "horcrux-api"
path = "src/main.rs"

[dependencies]
horcrux-common = { path = "../horcrux-common" }
horcrux-storage = { path = "../crates/horcrux-storage" }
horcrux-monitoring = { path = "../crates/horcrux-monitoring" }
horcrux-sdn = { path = "../crates/horcrux-sdn" }
horcrux-k8s = { path = "../crates/horcrux-k8s", optional = true }
horcrux-core = { path = "../crates/horcrux-core" }
horcrux-nas = { path = "../crates/horcrux-nas", optional = true }

# Web framework
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
futures = { workspace = true }

# Async runtime
tokio = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
toml = { workspace = true }

# Error handling
anyhow = { workspace = true }
thiserror = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }

# Compression (audit log rotation)
flate2 = { workspace = true }

# Process management
nix = { workspace = true }

# Authentication
uuid = { workspace = true }
chrono = { workspace = true }
jsonwebtoken = { workspace = true }
argon2 = { workspace = true }

# Monitoring
hostname = { workspace = true }
num_cpus = { workspace = true }

# Virtualization - libvirt bindings
virt = { workspace = true, optional = true }

# HTTP client (using rustls to avoid OpenSSL dependency)
reqwest = { workspace = true }
base64 = { workspace = true }
urlencoding = { workspace = true }
async-trait = { workspace = true }
rand = { workspace = true }
tempfile = { workspace = true }

# Email notifications
lettre = { workspace = true }

# Validation
regex = { workspace = true }
url = { workspace = true }

# Database
sqlx = { workspace = true }

# Security - constant-time comparison
subtle = { workspace = true }

# Encryption
aes-gcm = { workspace = true }
hex = { workspace = true }
sha2 = { workspace = true }
hmac = { workspace = true }
pwhash = { workspace = true }

# TLS listener (HTTPS by default), certificates, ACME
rustls = { workspace = true }
tokio-rustls = { workspace = true }
rustls-pemfile = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
rcgen = { workspace = true }
x509-parser = { workspace = true }
instant-acme = { workspace = true }

# Authentication realms and second factors
ldap3 = { workspace = true }
sha1 = { workspace = true }
p256 = { workspace = true }
rsa = { workspace = true }
ciborium = { workspace = true }

# Docker API client
bollard = { workspace = true }

# LXD/Incus consoles (USE=lxd / USE=incus): instance console and exec
# websockets over the daemon's Unix socket. (The SPICE relay's RSA-OAEP
# ticket uses the rsa/sha1 crates the auth code already depends on.)
tokio-tungstenite = { workspace = true, optional = true }

# Kubernetes client
kube = { workspace = true, optional = true }
k8s-openapi = { workspace = true, optional = true }
http = { workspace = true, optional = true }

[features]
default = ["qemu", "lxc", "docker", "backup", "pam"]

# Virtualization backends
qemu = ["virt", "horcrux-core/qemu", "horcrux-monitoring/qemu"]  # QEMU/KVM support with libvirt
# LXD/Incus support (VMs and containers, incl. their in-browser consoles)
lxd = ["dep:tokio-tungstenite", "horcrux-core/lxd"]
incus = ["dep:tokio-tungstenite", "horcrux-core/incus"]

# Container runtimes
lxc = ["horcrux-core/lxc"]         # LXC containers
docker = ["horcrux-core/docker"]      # Docker containers
podman = ["horcrux-core/podman"]      # Podman containers

# Additional features
cluster = ["horcrux-core/cluster"]     # Clustering/HA support
backup = ["horcrux-core/backup"]      # Backup and restore

# Linux-PAM realm (host accounts). Links libpam.
pam = ["horcrux-core/pam"]

# Kubernetes orchestration
kubernetes = ["kube", "k8s-openapi", "http", "horcrux-core/kubernetes", "dep:horcrux-k8s", "horcrux-k8s/kubernetes"]

# === NAS Features ===
# Core NAS functionality
nas = ["dep:horcrux-nas", "horcrux-nas/nas", "horcrux-core/nas"]                    # Core NAS module (shares, users, groups)

# File sharing protocols
smb = ["nas", "horcrux-nas/smb", "horcrux-core/smb"]               # SMB/Samba file sharing (Windows/cross-platform)
nfs-server = ["nas", "horcrux-nas/nfs-server", "horcrux-core/nfs-server"]        # NFS server for Unix/Linux exports
afp = ["nas", "horcrux-nas/afp", "horcrux-core/afp"]               # AFP/Netatalk for macOS file sharing
webdav = ["nas", "horcrux-nas/webdav", "horcrux-core/webdav"]            # WebDAV file access over HTTP/HTTPS
ftp = ["nas", "horcrux-nas/ftp", "horcrux-core/ftp"]               # FTP and SFTP server support

# NAS Authentication backends
nas-auth = ["nas", "horcrux-nas/nas-auth", "horcrux-core/nas-auth"]          # Core NAS authentication module
ldap = ["nas-auth", "horcrux-nas/ldap", "horcrux-core/ldap"]         # LDAP client integration
ldap-server = ["nas-auth", "horcrux-nas/ldap-server", "horcrux-core/ldap-server"]  # LDAP server (OpenLDAP slapd)
kerberos = ["nas-auth", "horcrux-nas/kerberos", "horcrux-core/kerberos"]     # Kerberos (MIT krb5) authentication
ad = ["nas-auth", "kerberos", "horcrux-nas/ad", "horcrux-core/ad"]  # Active Directory domain integration

# NAS Services
timemachine = ["afp", "horcrux-nas/timemachine", "horcrux-core/timemachine"]       # macOS Time Machine backup target
s3-gateway = ["nas", "horcrux-nas/s3-gateway", "horcrux-core/s3-gateway"]        # S3-compatible API gateway (MinIO)
iscsi-target = ["nas", "horcrux-nas/iscsi-target", "horcrux-core/iscsi-target"]      # iSCSI target for block storage
rsync-server = ["nas", "horcrux-nas/rsync-server", "horcrux-core/rsync-server"]      # Rsync daemon for efficient backups

# NAS Storage backends (runtime dependencies)
nas-zfs = ["nas", "horcrux-nas/nas-zfs", "horcrux-core/nas-zfs"]           # ZFS pool/dataset optimizations for NAS
nas-btrfs = ["nas", "horcrux-nas/nas-btrfs", "horcrux-core/nas-btrfs"]         # Btrfs subvolume/RAID support for NAS
nas-mdraid = ["nas", "horcrux-nas/nas-mdraid", "horcrux-core/nas-mdraid"]        # Linux software RAID (mdadm)
nas-lvm = ["nas", "horcrux-nas/nas-lvm", "horcrux-core/nas-lvm"]           # LVM thin provisioning for NAS

# NAS Feature bundles for convenience
nas-full = [
    "smb", "nfs-server", "afp", "webdav", "ftp",
    "nas-auth", "ldap", "ldap-server", "kerberos", "ad",
    "timemachine", "s3-gateway", "iscsi-target", "rsync-server",
    "nas-zfs", "nas-btrfs", "nas-mdraid", "nas-lvm"
]
nas-basic = ["smb", "nfs-server", "nas-auth"]
nas-apple = ["smb", "afp", "timemachine"]
nas-enterprise = ["smb", "nfs-server", "nas-auth", "ldap", "ad", "iscsi-target"]

[dev-dependencies]
# tests/console_tests.rs speaks VNC (RFB + DES auth), SPICE (link + RSA-OAEP
# ticket) and the console WebSockets to real QEMU VMs.
des = "0.8"
rsa = "0.9"
sha1 = "0.10"
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls", "cookies"], default-features = false }
criterion = { version = "0.5", features = ["html_reports", "async_tokio"] }

[[bench]]
name = "performance"
harness = false

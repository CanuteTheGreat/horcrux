[package]
name = "horcrux-ui"
version.workspace = true
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
leptos = { version = "0.6", features = ["csr"] }
leptos_meta = { version = "0.6", features = ["csr"] }
leptos_router = { version = "0.6", features = ["csr"] }
console_error_panic_hook = "0.1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
# QR code for authenticator-app enrollment (pure Rust, renders SVG)
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwasm = "0.5"
chrono = { version = "0.4", features = ["wasmbind"] }
horcrux-common = { path = "../../horcrux-common" }
web-sys = { version = "0.3", features = ["WebSocket", "MessageEvent", "ErrorEvent", "CloseEvent", "BinaryType", "Navigator", "Clipboard", "Window", "Storage", "Location", "History"] }
js-sys = "0.3"
base64 = "0.22"
gloo-timers = { version = "0.3", features = ["futures"] }
uuid = { version = "1.0", features = ["v4", "js"] }
urlencoding = "2.1"

[dev-dependencies]
# tests/api_contract.rs talks to a live horcrux-api (started by CI's Test
# job) and deserializes real responses into the UI's own api.rs types.
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
tokio = { workspace = true }

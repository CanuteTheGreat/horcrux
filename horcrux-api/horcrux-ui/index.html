<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Horcrux</title>
    <link data-trunk rel="rust" data-target-name="horcrux-ui" data-cargo-profile-release="wasm-release" />
    <link data-trunk rel="css" href="style/main.css">
    <link data-trunk rel="copy-file" href="assets/favicon.ico">
    <link data-trunk rel="copy-file" href="assets/favicon.png">
    <link data-trunk rel="copy-file" href="assets/apple-touch-icon.png">
    <link data-trunk rel="copy-dir" href="assets/brand">
    <!-- license inventory of the third-party crates (ci/third-party-licenses.py): served by the node, works offline -->
    <link data-trunk rel="copy-file" href="../../THIRD-PARTY-LICENSES.txt">
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#212b36" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#12161b" media="(prefers-color-scheme: dark)">
    <!-- shared map component (ui-kit/map, served by the API): loaded on first use by the /map page -->
    <script>
        window.hxMountMap = function (el, token) {
            var go = function () { window.UiMap.mount(el, { src: '/api/infra-map', headers: token ? { Authorization: 'Bearer ' + token } : {},
                emptyTitle: 'Nothing on this node yet', emptyText: 'VMs, containers, storage and networks appear here as soon as they exist.' }); };
            if (window.UiMap) return go();
            var css = document.createElement('link'); css.rel = 'stylesheet'; css.href = '/ui-map/map.css'; document.head.appendChild(css);
            var s = document.createElement('script'); s.src = '/ui-map/map.js'; s.onload = go; document.head.appendChild(s);
        };
    </script>
</head>
<body>
</body>
</html>

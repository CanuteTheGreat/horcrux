<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Horcrux</title>
    <link data-trunk rel="rust" data-target-name="horcrux-ui" data-cargo-profile-release="wasm-release" />
    <link data-trunk rel="css" href="style/main.css">
    <link data-trunk rel="css" href="style/utilities.css">
    <link data-trunk rel="css" href="style/ui-system.css">
    <link data-trunk rel="copy-dir" href="assets/fonts">
    <!-- fetched before the load event, so a page that renders text after hydrating never aborts a font download -->
    <link rel="preload" href="/fonts/ibm-plex-sans-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/fonts/ibm-plex-sans-latin-500-normal.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/fonts/ibm-plex-sans-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/fonts/ibm-plex-mono-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
    <!-- Appearance (user menu): theme / accent / density from localStorage, applied before first paint (no flash).
         No stored theme = follow the device's light/dark setting. -->
    <script>
      (function () {
        try {
          var d = document.documentElement, s = window.localStorage;
          var t = s.getItem("hx.theme"), a = s.getItem("hx.accent"), n = s.getItem("hx.density");
          if (t === "light" || t === "dark") d.setAttribute("data-theme", t);
          if (a && /^[a-z]+$/.test(a) && a !== "verdigris") d.setAttribute("data-accent", a);
          if (n === "compact" || n === "comfortable") d.setAttribute("data-density", n);
        } catch (e) {}
      })();
    </script>
    <link data-trunk rel="copy-file" href="assets/favicon.ico">
    <link data-trunk rel="copy-file" href="assets/favicon.png">
    <link data-trunk rel="copy-file" href="assets/apple-touch-icon.png">
    <link data-trunk rel="copy-dir" href="assets/brand">
    <!-- license inventory of the third-party crates (ci/third-party-licenses.py): served by the node, works offline -->
    <link data-trunk rel="copy-file" href="../../THIRD-PARTY-LICENSES.txt">
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#212b36" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#12161b" media="(prefers-color-scheme: dark)">
</head>
<body>
</body>
</html>

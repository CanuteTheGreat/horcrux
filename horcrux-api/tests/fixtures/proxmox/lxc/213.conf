#Sensor hub%3A camera media on its own volume
arch: amd64
cores: 2
features: nesting=1
hostname: sensors
memory: 1024
mp0: local-zfs:subvol-213-disk-1,mp=/var/lib/hub/cameras,backup=0,size=20G
nameserver: 192.0.2.3
net0: name=eth0,bridge=vmbr0,gw=192.0.2.1,hwaddr=52:54:00:20:20:43,ip=192.0.2.41/24,type=veth
onboot: 1
ostype: gentoo
rootfs: local-zfs:subvol-213-disk-0,size=8G
searchdomain: home.arpa
swap: 0
tags: sensors
unprivileged: 1

#Cold standby of an application server
arch: amd64
cores: 4
features: nesting=1,keyctl=1
hostname: apps-standby
memory: 3072
mp0: /tank/standby/apps,mp=/srv/apps,backup=0
nameserver: 192.0.2.3
net0: name=eth0,bridge=vmbr0,hwaddr=52:54:00:20:20:42,ip=192.0.2.90/24,rate=10,type=veth
onboot: 0
ostype: gentoo
rootfs: local-zfs:subvol-212-disk-0,size=40G
searchdomain: home.arpa
swap: 0
tags: standby
unprivileged: 1
lxc.cgroup2.io.max: 259:0 rbps=104857600 wbps=41943040 riops=2000 wiops=2000

#Backup target over SMB with a VPN client inside
arch: amd64
cores: 1
features: nesting=1
hostname: backup-smb
memory: 512
mp0: /tank/backups/laptop,mp=/srv/backups,backup=0
nameserver: 192.0.2.3
net0: name=eth0,bridge=vmbr0,gw=192.0.2.1,hwaddr=52:54:00:20:20:41,ip=192.0.2.32/24,type=veth
onboot: 1
ostype: gentoo
rootfs: local-zfs:subvol-211-disk-0,size=8G
searchdomain: home.arpa
startup: order=10
swap: 0
tags: backups
unprivileged: 1
lxc.cgroup2.devices.allow: c 10:200 rwm
lxc.mount.entry: /dev/net/tun dev/net/tun none bind,create=file
lxc.cgroup2.io.max: 8:16 rbps=31457280 wbps=20971520 riops=300 wiops=300

[package]
name = "horcrux-guest-tools"
description = "Horcrux guest tools: display capture/encode, input, clipboard and layout inside a VM for Horcrux Console"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "horcrux-guest-agent"
path = "src/main.rs"

[dependencies]
horcrux-guest-proto = { path = "../horcrux-guest-proto" }
serde_json = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# Microsoft's Windows API bindings (MIT OR Apache-2.0).
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_Environment",
    "Win32_System_IO",
    "Win32_System_Memory",
    "Win32_System_RemoteDesktop",
    "Win32_System_Services",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_System_Ole",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Media_MediaFoundation",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_Enumeration_Pnp",
    "Win32_Devices_HumanInterfaceDevice",
    "Win32_Devices_Properties",
    "Win32_System_SystemInformation",
    "Win32_Media_Audio",
    "Win32_Devices_FunctionDiscovery",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_System_Com_StructuredStorage",
] }
# Opus encoder for guest audio: opus (MIT OR Apache-2.0) over opusic-sys
# (BSD-3-Clause), which builds the bundled libopus (BSD-3-Clause) with cmake
# and links it statically. Windows only: the Linux agent encodes with FFmpeg.
opus = "0.4"
# Named only to choose libopus build options: no -fstack-protector and no
# _FORTIFY_SOURCE, whose runtime (__stack_chk_fail, __memset_chk...) lives in
# GCC's libssp (a DLL, or a static lib with its own CRT dependencies) on
# mingw-w64 runtimes before v11. The encoder only reads PCM produced by the
# agent itself; the other hardening flags stay on.
opusic-sys = { version = "0.7", features = ["no-stack-protector", "no-fortify-source"] }
# libopus 1.5 has no CPU detection for Arm on Windows (celt/arm/armcpu.c stops
# with #error) and its NEON intrinsics need that detection, so the Windows on
# Arm build uses the portable C code (10 ms stereo frames: far below the cost
# of the video encode).
[target.'cfg(all(windows, target_arch = "aarch64"))'.dependencies]
opusic-sys = { version = "0.7", features = ["no-simd"] }

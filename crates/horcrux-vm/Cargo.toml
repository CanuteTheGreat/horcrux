[package]
name = "horcrux-vm"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
horcrux-common = { path = "../../horcrux-common" }
horcrux-core = { path = "../horcrux-core" }
axum = { workspace = true }
chrono = { workspace = true }
futures = { workspace = true }
nix = { workspace = true }
rand = { workspace = true }
rsa = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha1 = { workspace = true }
subtle = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true }
tokio-tungstenite = { workspace = true, optional = true }
tracing = { workspace = true }
urlencoding = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[features]
# Each backend feature also turns on horcrux-core's flag of the same name:
# the runtime gate (horcrux_core::features::require_vm_hypervisor) reads
# horcrux-core's cfg, so `-p horcrux-vm --features qemu` (cargo-mutants,
# per-crate tests) must not end up with a VmManager that refuses QEMU.
qemu = ["horcrux-core/qemu"]
lxd = ["dep:tokio-tungstenite", "horcrux-core/lxd"]
incus = ["dep:tokio-tungstenite", "horcrux-core/incus"]

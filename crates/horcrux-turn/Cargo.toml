[package]
name = "horcrux-turn"
description = "Horcrux Console relay: a self-hosted TURN server (RFC 8656 subset) and the STUN/TURN message codec its clients use (docs/design/horcrux-console.md section 12)"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
base64 = { workspace = true }
crc32fast = "1"
hmac = { workspace = true }
md-5 = "0.10"
rand = { workspace = true }
sha1 = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

# Per-datagram destination address (IP_PKTINFO / IPV6_RECVPKTINFO), Linux only;
# the desktop client uses this crate on every OS.
[target.'cfg(target_os = "linux")'.dependencies]
nix = { workspace = true }

[package]
name = "horcrux-container"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
horcrux-common = { path = "../../horcrux-common" }
horcrux-core = { path = "../horcrux-core" }
horcrux-vm = { path = "../horcrux-vm" }
axum = { workspace = true }
bollard = { workspace = true }
chrono = { workspace = true }
futures = { workspace = true }
hex = { workspace = true }
nix = { workspace = true }
rand = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
sha2 = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[features]
# Forwarded to horcrux-core, whose cfg the runtime gate
# (horcrux_core::features::require_container_runtime) reads.
docker = ["horcrux-core/docker"]
podman = ["horcrux-core/podman"]
lxc = ["horcrux-core/lxc"]
lxd = ["horcrux-core/lxd"]
incus = ["horcrux-core/incus"]

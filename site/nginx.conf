server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;
    # Cloudflare terminates TLS: send plain-http visitors to https.
    if ($http_x_forwarded_proto = "http") { return 301 https://$host$request_uri; }
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    gzip on; gzip_types text/css text/plain application/json image/svg+xml;
    location / { try_files $uri $uri/ =404; add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always; add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always; }
    location /assets/ { add_header Cache-Control "public, max-age=3600" always;
        add_header X-Content-Type-Options nosniff always; }
    # Stable download URLs on the product domain: 302 to the GitHub release assets (the public mirror).
    # The daily build is a rolling pre-release (tag `daily`); stable builds are tags iso-* / v*.
    location ~ ^/download/horcrux-(?<var>desktop-)?daily-(?<arch>x86_64|aarch64)(?<ext>\.iso|\.iso\.sha256|-test-evidence\.tgz)$ {
        add_header Cache-Control "no-store" always; add_header X-Content-Type-Options nosniff always;
        return 302 https://github.com/CanuteTheGreat/horcrux/releases/download/daily/horcrux-${var}daily-$arch$ext;
    }
    location ~ ^/download/horcrux-(?<tag>(?:iso-|v)[0-9][0-9A-Za-z.]*)-(?<arch>x86_64|aarch64)(?<ext>\.iso|\.iso\.sha256|-iso-test-evidence\.tgz)$ {
        add_header Cache-Control "no-store" always; add_header X-Content-Type-Options nosniff always;
        return 302 https://github.com/CanuteTheGreat/horcrux/releases/download/$tag/horcrux-$tag-$arch$ext;
    }
    location = /version.txt { default_type text/plain; add_header Cache-Control "no-store" always; }
    location = /health { access_log off; default_type text/plain; return 200 "ok\n"; }
    error_page 404 /404.html;
}

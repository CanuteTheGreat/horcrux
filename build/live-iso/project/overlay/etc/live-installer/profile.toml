# Horcrux profile for the shared guided installer (live-installer)
name = "horcrux"
title = "Horcrux"
network_mode = "management"          # one management NIC
filesystems = ["ext4", "xfs", "zfs"]
swap_mb = 4096
web_scheme = "https"
web_port = 8006
default_hostname = "horcrux.localdomain"
# read by horcrux-api (init script) on the first start, then deleted
admin_password_file = "/etc/horcrux/admin-password"
admin_password_owner = "root"
services = ["horcrux-api", "libvirtd", "docker", "dbus", "sshd", "dhcpcd"]
# console menu (installed system)
web_service = "horcrux-api"
db_path = "/var/lib/horcrux/horcrux.db"
db_table = "users"
config_paths = ["/etc/horcrux", "/var/lib/horcrux/horcrux.db"]
factory_reset_files = ["/var/lib/horcrux/initial-admin-password"]
reapply_services = []

# official logo, crop/scale only (branding/README.md); the installer GUI + boot menu read these
logo_mark = "/usr/share/live-installer/branding/mark-256.png"
logo_full = "/usr/share/live-installer/branding/full.png"
logo_wordmark = "/usr/share/live-installer/branding/wordmark.png"

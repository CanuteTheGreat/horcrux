# Horcrux profile for the shared guided installer (live-installer)
name = "horcrux"
title = "Horcrux"
network_mode = "management"          # one management NIC
filesystems = ["zfs", "xfs-luks", "xfs", "ext4"]
swap_mb = 4096
web_scheme = "https"
web_port = 8006
default_hostname = "horcrux.localdomain"
# read by horcrux-api (init script) on the first start, then deleted
admin_password_file = "/etc/horcrux/admin-password"
admin_password_owner = "root"
services = ["horcrux-api", "libvirtd", "docker", "dbus", "sshd", "dhcpcd"]
# console menu (installed system)
web_service = "horcrux-api"
db_path = "/var/lib/horcrux/horcrux.db"
db_table = "users"
config_paths = ["/etc/horcrux", "/var/lib/horcrux/horcrux.db"]
factory_reset_files = ["/var/lib/horcrux/initial-admin-password"]
reapply_services = []

# official logo, crop/scale only (branding/README.md); the installer GUI + boot menu read these
logo_mark = "/usr/share/live-installer/branding/mark-256.png"
logo_full = "/usr/share/live-installer/branding/full.png"
logo_wordmark = "/usr/share/live-installer/branding/wordmark.png"
# "Try it live" boot entry: services started from RAM (random admin password per session; docker needs real storage)
live_services = ["horcrux-api", "dbus", "libvirtd"]

# installer pages (stages.py): optional services the user may switch off, hardening defaults, USE-flag page
brand_color = "#6a3fa0"
services_optional = ["docker", "libvirtd"]
service_info = { docker = "container runtime (Docker)", libvirtd = "KVM/QEMU virtual machine manager (libvirt)" }
# product-critical USE flags: the USE page refuses to change them (entries: "flag" or "category/package:flag")
use_critical = ["app-emulation/libvirt:qemu", "app-emulation/qemu:kvm", "app-containers/docker:overlay2"]
use_critical_why = { "app-emulation/libvirt:qemu" = "Horcrux manages virtual machines through libvirt's QEMU driver", "app-emulation/qemu:kvm" = "KVM acceleration is what makes Horcrux VMs usable" }

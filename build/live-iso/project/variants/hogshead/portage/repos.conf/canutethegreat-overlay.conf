# the owner's overlay: www-client/brave-bin (installs the brave-browser-stable wrapper + suid chrome-sandbox the .desktop file needs).
# The image used to carry its own stale copy of the ebuild (repo horcrux-gnome-light) whose .desktop Exec pointed at a missing binary.
[canutethegreat-overlay]
location = /var/db/repos/canutethegreat-overlay
sync-type = git
sync-uri = https://github.com/CanuteTheGreat/canutethegreat-overlay.git
sync-depth = 1
auto-sync = yes

# repositories of the gringotts image (trees are fetched on the first boot: gringotts-firstboot / emaint sync)
[guru]
location = /var/db/repos/guru
sync-type = git
sync-uri = https://github.com/gentoo-mirror/guru.git
sync-depth = 1
auto-sync = yes

[canutethegreat-overlay]
location = /var/db/repos/canutethegreat-overlay
sync-type = git
sync-uri = https://github.com/CanuteTheGreat/canutethegreat-overlay.git
sync-depth = 1
auto-sync = yes

# the Horcrux overlay (repo gentoo/): rustinion-bin, ...
[horcrux]
location = /var/db/repos/horcrux
masters = gentoo
auto-sync = no

# this variant's local overlay (gringotts-tools, horcrux-image-files, gringotts-private)
[horcrux-gringotts]
location = /var/db/repos/horcrux-gringotts
masters = gentoo
auto-sync = no

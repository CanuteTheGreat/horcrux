# gringotts: the agent's public keys ship in /etc/gringotts/authorized_keys (private image only); ~/.ssh/authorized_keys still works
AuthorizedKeysFile /etc/gringotts/authorized_keys .ssh/authorized_keys
PubkeyAuthentication yes
UseDNS no
SetEnv PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

[horcrux]
location = /var/db/repos/horcrux
masters = gentoo
auto-sync = no

# the owner's overlay (Brave, alienfx): the image carries a plain copy, the first boot replaces it with a git checkout and every later
# `emaint sync -a` updates it. Without sync-type/sync-uri `emaint sync -r` fails and hogsmeade-firstboot-net retried for ever.
[canutethegreat-overlay]
location = /var/db/repos/canutethegreat
masters = gentoo
sync-type = git
sync-uri = https://github.com/CanuteTheGreat/canutethegreat-overlay.git
sync-depth = 1
auto-sync = yes

[local]
location = /var/db/repos/local
masters = gentoo
auto-sync = no

# The console menu (and the login prompt) own the console once a getty is up. systemd keeps printing "[  OK  ] Started ..." for every unit
# that finishes after the getty (docker, horcrux-api on a desktop install), which scrolled the menu off the serial console: GNOME systemd
# auto-ext4 console-menu-shown failed. OpenRC never does this (its getty starts after the default runlevel). Failures are still shown.
[Manager]
ShowStatus=error

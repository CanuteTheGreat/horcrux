# Live/installer image (systemd): tty1 runs what live-installer.service chose for the boot-menu mode (see /usr/libexec/live-getty-tty1).
# The installer removes this file from the installed system.
[Unit]
After=live-installer.service live-product.service

[Service]
ExecStart=
ExecStart=-/usr/libexec/live-getty-tty1

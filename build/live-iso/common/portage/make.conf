# Written by the live-iso builder (replaces the stage3 make.conf; keeps the
# stage3's generic x86-64 CFLAGS so the official binhost matches).
COMMON_FLAGS="-O2 -pipe"
CFLAGS="${COMMON_FLAGS}"
CXXFLAGS="${COMMON_FLAGS}"
FCFLAGS="${COMMON_FLAGS}"
FFLAGS="${COMMON_FLAGS}"
LC_MESSAGES=C.utf8
MAKEOPTS="-j4"
# No namespaces/ptrace sandbox inside an unprivileged `docker build` step.
FEATURES="-sandbox -usersandbox -network-sandbox -pid-sandbox -ipc-sandbox -news buildpkg ccache"
CCACHE_DIR="/var/cache/ccache"
PKGDIR="/var/cache/binpkgs"
DISTDIR="/var/cache/distfiles"
EMERGE_DEFAULT_OPTS="--getbinpkg --usepkg --binpkg-respect-use=y --jobs=2 --load-average=6 --quiet-build=y --autounmask-write=y --autounmask-continue=y --autounmask-keep-keywords=y --autounmask-keep-masks=y"
ACCEPT_LICENSE="-* @FREE @BINARY-REDISTRIBUTABLE"
QEMU_SOFTMMU_TARGETS="x86_64"
QEMU_USER_TARGETS=""
GRUB_PLATFORMS="efi-64 pc"

# Written by the live-iso builder (replaces the stage3 make.conf; keeps the
# stage3's generic baseline CFLAGS (x86-64 / armv8 / rv64gc) so the official binhost matches).
COMMON_FLAGS="-O2 -pipe"
CFLAGS="${COMMON_FLAGS}"
CXXFLAGS="${COMMON_FLAGS}"
FCFLAGS="${COMMON_FLAGS}"
FFLAGS="${COMMON_FLAGS}"
LC_MESSAGES=C.utf8
MAKEOPTS="-j4"
# No namespaces/ptrace sandbox inside an unprivileged `docker build` step.
FEATURES="-sandbox -usersandbox -network-sandbox -pid-sandbox -ipc-sandbox -news buildpkg ccache"
CCACHE_DIR="/var/cache/ccache"
PKGDIR="/var/cache/binpkgs"
DISTDIR="/var/cache/distfiles"
# x11-wm/mutter is always built from source: /etc/portage/patches/x11-wm/mutter (ScreenCast frame limiter, see sys-apps/horcrux-repo-config) does not
# apply to binary packages. Drop the exclude together with that patch once mutter >= 51.2 is stable.
EMERGE_DEFAULT_OPTS="--getbinpkg --usepkg --usepkg-exclude=x11-wm/mutter --binpkg-respect-use=y --jobs=2 --load-average=6 --quiet-build=y --autounmask-write=y --autounmask-continue=y --autounmask-keep-keywords=y --autounmask-keep-masks=y"
ACCEPT_LICENSE="-* @FREE @BINARY-REDISTRIBUTABLE"
# GRUB_PLATFORMS / QEMU_*_TARGETS are per architecture (common/arch/<arch>.make.conf)
source /etc/portage/make.conf.arch

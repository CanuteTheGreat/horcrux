[workspace]
resolver = "2"
members = [
    "horcrux-api",
    "crates/horcrux-backup",
    "crates/horcrux-container",
    "crates/horcrux-vm",
    "crates/horcrux-cluster",
    "crates/horcrux-auth",
    "crates/horcrux-storage",
    "crates/horcrux-monitoring",
    "crates/horcrux-sdn",
    "crates/horcrux-k8s",
    "crates/horcrux-core",
    "crates/horcrux-nas",
    "horcrux-api/horcrux-ui",
    "horcrux-mobile",
    "horcrux-common",
    "horcrux-cli",
    "terraform-provider-horcrux",
]

[workspace.package]
version = "0.1.5"
edition = "2021"
authors = ["Horcrux Contributors"]
license = "GPL-3.0"
repository = "https://github.com/CanuteTheGreat/horcrux"
homepage = "https://github.com/CanuteTheGreat/horcrux"

[workspace.dependencies]
# Shared dependencies across workspace
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"

# horcrux-api and the crates split out of it
axum = { version = "0.7", features = ["ws"] }
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["fs", "trace", "cors"] }
futures = "0.3"
serde_yaml = "0.9"
toml = "0.8"
flate2 = "1.0"
nix = { version = "0.29", features = ["process", "signal", "fs", "term", "ioctl"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
jsonwebtoken = "9.3"
argon2 = { version = "0.5", features = ["std"] }
hostname = "0.4"
num_cpus = "1.16"
virt = { version = "0.4" }
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream"], default-features = false }
base64 = "0.22"
urlencoding = "2.1"
async-trait = "0.1"
rand = "0.8"
tempfile = "3.8"
lettre = { version = "0.11", default-features = false, features = ["tokio1", "tokio1-rustls-tls", "smtp-transport", "builder"] }
regex = "1.10"
url = "2.5"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "chrono", "uuid"] }
subtle = "2.5"
aes-gcm = "0.10"
hex = "0.4"
sha2 = "0.10"
hmac = "0.12"
pwhash = "1.0"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls-pemfile = "2"
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["server", "server-auto", "tokio", "service", "http1", "http2"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring", "x509-parser"] }
x509-parser = "0.18"
instant-acme = { version = "0.8", default-features = false, features = ["hyper-rustls", "ring", "rcgen"] }
ldap3 = { version = "0.12", default-features = false, features = ["tls-rustls-ring"] }
sha1 = "0.10"
p256 = { version = "0.13", features = ["ecdsa"] }
rsa = { version = "0.9", features = ["sha2"] }
ciborium = "0.2"
bollard = "0.17"
tokio-tungstenite = { version = "0.24" }
kube = { version = "0.98", features = ["runtime", "derive", "ws"] }
k8s-openapi = { version = "0.24", features = ["v1_32"] }
http = { version = "1.0" }

# Release builds (CI, release.yml, the Gentoo ebuild). Size-optimised as
# before, but thin LTO with parallel codegen units: fat LTO with one
# codegen unit (meant for the WASM UI, see below) made the final
# horcrux-api link a single ~6 GB rustc process; thin LTO peaks around
# 2 GB for the same build.
[profile.release]
opt-level = "z"
lto = "thin"

# The WASM web UI keeps the smallest-download settings: trunk builds it
# with this profile (data-cargo-profile-release in horcrux-ui/index.html).
[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
